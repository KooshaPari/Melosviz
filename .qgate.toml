# qgate configuration for MelosViz
# Granular-recursive quality gate — 100% per module, recursively.
#
# Schema (qgate/src/config/mod.rs): flat keys with deny_unknown_fields.
# Nested sections ([coverage], [checks], [e2e], ...) are NOT supported by the
# Rust config loader — they would cause the whole file to fail to deserialize
# and qgate would silently fall back to defaults. The bottom of this file
# documents the runner-side knobs as comments for human context.
#
# In-repo reusable workflow (promoted from phenotype-tooling; upstream
# workflow_call entrypoint is unparseable on GitHub — see ci.yml history):
#   uses: ./.github/workflows/quality-gate-reusable.yml
# Standalone baseline gate:
#   .github/workflows/qgate.yml
# External repos may call:
#   uses: KooshaPari/Melosviz/.github/workflows/quality-gate-reusable.yml@main

# ─── Coverage gate ────────────────────────────────────────────────────────
# Granular-recursive: every module must clear this threshold (no hiding
# behind the average). Target end-state = 100% on every module; the
# current measured coverage is 81% (42 modules below 100%, including
# two at 0% — `src/melosviz/llm/critic/__init__.py` (226 valid lines)
# and `src/melosviz/presets/aspect_ratios.py` (23 valid lines)).
coverage_threshold = 100
coverage_path = "backend/coverage/lcov.info"
coverage_format = "lcov"

# ─── N/A check categories ─────────────────────────────────────────────────
# qgate marks these as not_applicable instead of running them.
#
# - a11y: WKWebView/Electrobun UI — no headless Chromium in Linux CI
#   (manual on host).
# - integration: this repo runs integration tests via pytest
#   (studio-tests.yml); qgate's cargo fallback (`cargo test --workspace
#   --test '*'`) fails because crates/melosviz-demo is a [[bin]]-only
#   fixture with no test target.
# - property: qgate's cargo fallback (`cargo test --workspace --features
#   proptest`) fails because no workspace member exposes a `proptest`
#   feature. The actual property tests run via TestPropertyPresets in
#   pytest.
not_applicable = ["a11y", "integration", "property"]

# ─── Mutation score floor (for `cargo mutants`) ───────────────────────────
mutation_threshold = 75

# ─── Perf budgets (init time / edit latency in ms) ────────────────────────
perf_init_ms = 15000
perf_edit_ms = 5000

# ─── Documentation: runner-side knobs (not consumed by qgate config) ──────
#
# The qgate baseline workflow also runs pytest/bandit/e2e checks BEFORE
# qgate (when `run-baseline-checks: true`). Those steps read from the
# workflow file and don't consult this TOML. They're documented here for
# operator context.
#
# [e2e]
#   backend_suite   = "backend/tests/test_e2e_pipeline_smoke.py"
#   desktop_suite   = "desktop/tests/e2e_desktop.test.ts"
#   desktop_ci_platform = "macos"  # Linux runner has no AppKit/display
#
# [mutation]
#   run: mutmut run --paths-to-mutate backend/src/melosviz/ \
#                    --tests-dir backend/tests/
#   target_score = 75
#
# [security]
#   sast_tool    = "bandit"   # high/critical only (exit 1 on findings)
#   min_severity = "high"     # medium = warn-only
#
# [perf]
#   init_budget_ms = 15000    # analysis init (spec_from_wav)
#   edit_budget_ms = 5000     # segment re-render / scrub

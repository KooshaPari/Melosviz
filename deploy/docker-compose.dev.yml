# MelosViz development-stack compose file.
#
# Spins up the production toolchain Adapters route to when running
# the studio pipeline locally:
#
#   - comfyui          — actual ComfyUI worker (GPU optional) that
#                        executes the workflow.json files generated
#                        by `viz generate` for every scene.
#   - comfyui-cpu      — ComfyUI image-only worker without GPU, for
#                        machines that don't have a CUDA card. Uses
#                        `--cpu-llm` is not a thing; ComfyUI itself
#                        happily runs SDXL on CPU (slowly).
#   - c4d-stub         — Cinema 4D HTTP listener stub. Real C4D has
#                        no headless HTTP API, so this worker accepts
#                        the per-scene render command JSON the
#                        C4DAdapter emits and pretends to drive a
#                        c4dpy subprocess. Lets the full pipeline
#                        pass smoke tests without a C4D license.
#   - melosviz-bridge  — FastAPI bridge that the web/desktop Director's
#                        Console hits, plus runs the offline-mode
#                        fallback when no backend is reachable.
#
# Profiles:
#   default  → bridge + ComfyUI-GPU + C4D stub
#   cpu      → bridge + ComfyUI-CPU + C4D stub
#   full     → bridge + ComfyUI-GPU + ComfyUI-CPU + C4D stub
#
# Run:
#   make dev-up            # GPU profile
#   COMPOSE_PROFILES=cpu make dev-up   # CPU profile
#   make dev-pipeline      # run the 5-step pipeline against the stack
#
# Out of the box this requires Docker Engine 24+ and Compose v2.
# GPU profile requires nvidia-container-toolkit.

services:
  # ─────────────────────────────────────────────────────────────────
  # ComfyUI worker (GPU) — real SDXL + Wan 2.1 + AnimateDiff
  # ─────────────────────────────────────────────────────────────────
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-base-cuda12.1.1
    profiles: ["default", "full"]
    container_name: melosviz-comfyui
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - MELOSVIZ_WORKER_ID=comfyui-gpu
      # Tell the ComfyUIAdapter where to POST workflow.json
      - COMFYUI_LISTEN=0.0.0.0:8188
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --disable-auto-launch
      # Match the melosviz backend default
      - MELOSVIZ_COMFYUI_URL=http://comfyui:8188
    volumes:
      - ../backend/workflows:/workspace/workflows:ro # share our templates
      - comfyui-models:/workspace/models # cached model downloads
      - comfyui-output:/workspace/output # rendered scenes land here
    ports:
      - "8188:8188"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # first launch downloads models
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # ComfyUI worker (CPU-only fallback) — SDXL only, slow but works
  # ─────────────────────────────────────────────────────────────────
  comfyui-cpu:
    image: ghcr.io/ai-dock/comfyui:latest-base
    profiles: ["cpu", "full"]
    container_name: melosviz-comfyui-cpu
    environment:
      - MELOSVIZ_WORKER_ID=comfyui-cpu
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --cpu --disable-auto-launch
      - MELOSVIZ_COMFYUI_URL=http://comfyui-cpu:8188
    volumes:
      - ../backend/workflows:/workspace/workflows:ro
      - comfyui-cpu-models:/workspace/models
      - comfyui-cpu-output:/workspace/output
    ports:
      - "8189:8188"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Cinema 4D headless stub — accepts the per-scene c4d_render_plan.json
  # the C4DAdapter emits and pretends to run c4dpy.
  # Real Cinema 4D has no headless HTTP API; this lets the pipeline smoke
  # without a C4D license. The interface matches what a real C4D worker
  # would expose (POST /render {plan} → 200 {output_dir}).
  # ─────────────────────────────────────────────────────────────────
  c4d-stub:
    build:
      context: ./comfyui # re-uses the python:3.11-slim base from c4d stub
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN pip install --no-cache-dir fastapi==0.110 uvicorn[standard]==0.29 pydantic==2.6
        COPY scripts/c4d_stub_server.py /c4d_stub_server.py
        EXPOSE 8189
        CMD ["uvicorn", "c4d_stub_server:app", "--host", "0.0.0.0", "--port", "8189"]
    profiles: ["default", "cpu", "full"]
    container_name: melosviz-c4d-stub
    environment:
      - MELOSVIZ_WORKER_ID=c4d-stub
      - MELOSVIZ_C4D_STUB=1
      # The C4DAdapter connects here when MELOSVIZ_C4D_URL is set.
      - MELOSVIZ_C4D_URL=http://c4d-stub:8189
    ports:
      - "8190:8189"
    volumes:
      - ./scripts:/scripts:ro
      - c4d-stub-output:/workspace/output
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # MelosViz bridge — the FastAPI server the web/desktop UIs hit.
  # Runs the 5-step pipeline CLI in subprocesses and proxies
  # /api/render/events SSE to the in-process RenderEventBus.
  # ─────────────────────────────────────────────────────────────────
  melosviz-bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: melosviz-bridge
    profiles: ["default", "cpu", "full"]
    environment:
      - MELOSVIZ_BRIDGE_HOST=0.0.0.0
      - MELOSVIZ_BRIDGE_PORT=8787
      - MELOSVIZ_BRIDGE_TOKEN=dev-token-change-me
      - MELOSVIZ_COMFYUI_URL=http://comfyui:8188
      - MELOSVIZ_C4D_URL=http://c4d-stub:8189
      - MELOSVIZ_COMFYUI_OFFLINE=0 # disable fallback so real backends run
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    ports:
      - "8787:8787"
    volumes:
      - ../backend:/app/backend:ro
      - ../backend/src:/app/src:ro
      - ../backend/workflows:/app/workflows:ro
      - bridge-renders:/renders # shared with host so `viz ship` can package
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "melosviz.bridge.server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8787",
        "--log-level",
        "info",
      ]
    depends_on:
      comfyui:
        condition: service_healthy
        required: false
      comfyui-cpu:
        condition: service_healthy
        required: false
      c4d-stub:
        condition: service_started
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8787/health').status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  comfyui-models:
  comfyui-output:
  comfyui-cpu-models:
  comfyui-cpu-output:
  c4d-stub-output:
  bridge-renders:

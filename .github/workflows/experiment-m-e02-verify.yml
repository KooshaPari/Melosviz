name: Experiment - M-E02 contract verification

on:
  push:
    branches:
      - experiment/mature-recovery-m-e02
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "desktop/**"
      - ".github/workflows/experiment-m-e02-verify.yml"

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg and backend
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e "backend[test]"
          python -m pip install python-multipart
      - name: Focused M-E02 contract
        run: python -m pytest backend/tests/conductor/test_m_e02_scene_contract.py -q --no-header --timeout=60
      - name: Existing conductor and bridge regressions
        run: |
          python -m pytest backend/tests/conductor backend/tests/test_bridge_studio_pipeline.py             -q --no-header --timeout=60 -k "not test_render_events_stream_returns_event_stream_content_type"

  web-hard-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.1.34
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx tsc --noEmit -p tsconfig.json
        working-directory: web
      - run: bunx vitest run src/components/__tests__/StudioConsole.test.tsx
        working-directory: web

  desktop-hard-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.1.34
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bunx tsc --noEmit -p tsconfig.json
        working-directory: desktop

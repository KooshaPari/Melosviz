name: Supply-chain — audit + SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  python-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + pip-audit
        working-directory: backend
        run: |
          pip install -e ".[bridge,analysis]"
          pip install pip-audit
      - name: Run pip-audit
        working-directory: backend
        # Fail on known vulnerable deps in the installed environment.
        run: python -m pip_audit --progress-spinner off

  rust-audit:
    name: cargo-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # Hard-fail: local `cargo audit` is clean (exit 0; unmaintained warnings
        # only). pip-audit remains hard-fail for Python.
        run: cargo audit

  cargo-deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe
        with:
          command: check licenses bans sources
          arguments: --all-features

  reserved-names:
    name: Reserved-name / dep-confusion
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Check reserved names + private registries
        run: python scripts/check_reserved_names.py

  lock-verify:
    name: Frozen lock verify (uv + cargo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: uv lock --check
        working-directory: backend
        run: uv lock --check
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 >/dev/null

  repro-smoke:
    name: SOURCE_DATE_EPOCH repro smoke (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Repro smoke (archive + melosviz-mir double-build)
        run: |
          chmod +x scripts/check_repro_smoke.sh
          ./scripts/check_repro_smoke.sh

  sdk-pack-smoke:
    name: SDK pack + tarball install smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      - name: SDK pack smoke (@melosviz/* publishable shape)
        run: |
          sed -i 's/\r$//' scripts/check_sdk_pack_smoke.sh
          chmod +x scripts/check_sdk_pack_smoke.sh
          ./scripts/check_sdk_pack_smoke.sh

  hermetic-smoke:
    name: Hermetic / offline build smoke (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Hermetic Rust smoke (fetch once + offline melosviz-mir check)
        run: |
          sed -i 's/\r$//' scripts/check_hermetic_smoke.sh
          chmod +x scripts/check_hermetic_smoke.sh
          bash scripts/check_hermetic_smoke.sh
      - name: Hermetic Python smoke (wheelhouse prefetch + offline import)
        run: |
          sed -i 's/\r$//' scripts/check_hermetic_python_smoke.sh
          chmod +x scripts/check_hermetic_python_smoke.sh
          bash scripts/check_hermetic_python_smoke.sh

  portability-smoke:
    name: Core portability without FFmpeg/Blender
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - name: Portability smoke (core import + graceful host-tool absence)
        run: python scripts/check_portability_smoke.py

  sbom:
    name: CycloneDX SBOM (python + cargo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: Generate Python CycloneDX SBOM
        working-directory: backend
        run: |
          pip install 'cyclonedx-bom>=4.0'
          pip install -e .
          cyclonedx-py environment -o ../sbom-python.cdx.json
      - name: Generate Cargo CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx -f json --all
          # cargo-cyclonedx writes per-crate files; collect into one artifact dir
          mkdir -p sbom-out
          cp sbom-python.cdx.json sbom-out/ 2>/dev/null || true
          find . -maxdepth 3 -name '*.cdx.json' -o -name 'bom.xml' -o -name '*cyclonedx*' | head -20
          cp -v crates/*/melosviz*.cdx.json sbom-out/ 2>/dev/null || true
          cp -v *.cdx.json sbom-out/ 2>/dev/null || true
          ls -la sbom-out || ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: melosviz-sbom
          path: |
            sbom-python.cdx.json
            sbom-out/
            **/*.cdx.json
          if-no-files-found: warn
          retention-days: 30

name: Experiment - durable revision ledger
on:
  push:
    branches: [experiment/melosviz-durable-ledger-pass10]
  pull_request:
    branches: [main]
    paths:
      - "backend/experiments/mature_recovery_durable_ledger.py"
      - "backend/tests/experiments/test_mature_recovery_durable_ledger.py"
      - ".github/workflows/experiment-durable-ledger.yml"
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Syntax gate
        run: |
          python -m py_compile backend/experiments/mature_recovery_durable_ledger.py
          python -m py_compile backend/tests/experiments/test_mature_recovery_durable_ledger.py
      - name: Durable state adversarial controls
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv --tb=long backend/tests/experiments/test_mature_recovery_durable_ledger.py 2>&1 | tee durable-ledger-pytest.txt
      - name: Upload behavioral failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-ledger-pytest
          path: durable-ledger-pytest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Require behavioral pass
        run: test "${{ steps.pytest.outcome }}" = success
      - name: Record SQLite runtime
        run: python - <<'PY'
          import sqlite3
          print(sqlite3.sqlite_version)
          PY

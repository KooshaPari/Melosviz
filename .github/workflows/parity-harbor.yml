name: Eval — parity + Harbor runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-python-parity:
    name: Rust ↔ Python RenderSpec parity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Build melosviz-mir
        run: cargo build --release -p melosviz-mir
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Parity tests
        working-directory: backend
        env:
          MELOSVIZ_MIR_BIN: ${{ github.workspace }}/target/release/melosviz-mir
        run: python -m pytest tests/test_rust_python_parity.py -q --tb=short

  harbor-runner:
    name: Harbor emit + verify (live runner smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[test,bridge]"
      - name: Emit Harbor task trees
        run: python eval/harbor/adapter.py --out eval/harbor/out
      - name: Run Harbor verifiers
        working-directory: backend
        run: |
          python -m pytest \
            ../eval/harbor/out/melosviz-analyze-sine/tests/test_analyze_sine.py \
            ../eval/harbor/out/melosviz-bridge-health/tests/test_bridge_health.py \
            -q --tb=short
      - name: Upload Harbor out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: harbor-out
          path: eval/harbor/out/
          if-no-files-found: error
          retention-days: 7

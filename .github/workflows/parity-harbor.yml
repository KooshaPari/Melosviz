name: Eval — parity + Harbor runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-python-parity:
    name: Rust ↔ Python RenderSpec parity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          # No `cache: pip` here: this job installs with `uv pip install`, and
          # setup-python's pip cache hard-errors at post-job time when pip never
          # runs and its cache dir was never created. astral-sh/setup-uv caches
          # the uv store from uv.lock instead.
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"
      - name: Build melosviz-mir
        run: cargo build --release -p melosviz-mir
      - name: Install backend
        working-directory: backend
        # --only-binary :all: means no third-party source distribution may be
        # built, so no package setup.py can run at install time (S8541). The
        # package set comes from the committed uv.lock via `uv export`, and
        # --no-deps installs exactly those pinned versions without resolving
        # anything, so the install stays lock-exact (S8544).
        # These flags are verified against the uv version pinned above,
        # not a globally installed one: `uv export --format` alone has
        # already changed its accepted value across uv releases.
        run: |
          uv export --locked --no-emit-project --no-hashes \
            --extra test \
            --output-file "$RUNNER_TEMP/uv-requirements.txt"
          uv venv
          uv pip install --only-binary :all: --no-deps -r "$RUNNER_TEMP/uv-requirements.txt"
          uv pip install --only-binary :all: --no-deps setuptools wheel
          # First-party source: the one thing that legitimately gets built.
          uv pip install --no-deps --no-build-isolation -e .
      - name: Parity tests
        working-directory: backend
        env:
          MELOSVIZ_MIR_BIN: ${{ github.workspace }}/target/release/melosviz-mir
        run: uv run --locked --no-sync python -m pytest tests/test_rust_python_parity.py -q --tb=short

  harbor-runner:
    name: Harbor emit + verify (live runner smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          # No `cache: pip` here: this job installs with `uv pip install`, and
          # setup-python's pip cache hard-errors at post-job time when pip never
          # runs and its cache dir was never created. astral-sh/setup-uv caches
          # the uv store from uv.lock instead.
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"
      - name: Install backend
        working-directory: backend
        # --only-binary :all: means no third-party source distribution may be
        # built, so no package setup.py can run at install time (S8541). The
        # package set comes from the committed uv.lock via `uv export`, and
        # --no-deps installs exactly those pinned versions without resolving
        # anything, so the install stays lock-exact (S8544).
        # These flags are verified against the uv version pinned above,
        # not a globally installed one: `uv export --format` alone has
        # already changed its accepted value across uv releases.
        run: |
          uv export --locked --no-emit-project --no-hashes \
            --extra test \
            --extra bridge \
            --output-file "$RUNNER_TEMP/uv-requirements.txt"
          uv venv
          uv pip install --only-binary :all: --no-deps -r "$RUNNER_TEMP/uv-requirements.txt"
          uv pip install --only-binary :all: --no-deps setuptools wheel
          # First-party source: the one thing that legitimately gets built.
          uv pip install --no-deps --no-build-isolation -e .
      - name: Emit Harbor task trees
        # Runs from the repo root, so point uv at the backend project
        # that holds the lock.
        run: uv run --locked --no-sync --project backend python eval/harbor/adapter.py --out eval/harbor/out
      - name: Run Harbor verifiers
        working-directory: backend
        run: |
          uv run --locked --no-sync python -m pytest \
            ../eval/harbor/out/melosviz-analyze-sine/tests/test_analyze_sine.py \
            ../eval/harbor/out/melosviz-bridge-health/tests/test_bridge_health.py \
            -q --tb=short
      - name: Upload Harbor out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: harbor-out
          path: eval/harbor/out/
          if-no-files-found: error
          retention-days: 7

# Pull secrets from Infisical into CI
# Requires: INFISICAL_TOKEN (machine identity service token) stored in repo secrets
# Docs: https://infisical.com/docs/cli/usage

name: Infisical Sync

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/infisical.yml"

jobs:
  sync-secrets:
    name: Pull secrets from Infisical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Infisical CLI
        env:
          INFISICAL_VERSION: v0.43.138
          # sha256 of infisical_0.43.138_linux_amd64.deb, copied verbatim from
          # checksums.txt published with the release. Bumping INFISICAL_VERSION
          # without updating this makes the install fail closed; renovate cannot
          # do that automatically because the digest is not derivable from the
          # tag, so it is deliberate friction rather than an oversight.
          INFISICAL_AMD64_SHA256: 9651994ecaf3445770565422c5ca32714f98e110f9e684d0c2aa7dcacbe04b56
        run: |
          # Install the published .deb directly instead of executing
          # dl.cloudsmith.io's setup.deb.sh with sudo. That script is fetched over
          # the network and run as root, so an altered or MITM'd response gets
          # arbitrary root code on the runner -- and it is the step that also
          # has the Infisical token in scope. The signed release asset plus the
          # digest below removes the shell entirely: there is no remote script
          # to trust, only a byte-for-byte comparison against a pinned hash.
          #
          # The digest comes from the release's own checksums.txt, so this is
          # the same artifact Cloudsmith's script would have installed, minus
          # the trust-on-first-use in the script.
          set -euo pipefail
          ARCH="$(dpkg --print-architecture)"
          # The release tag is v0.43.138 but the asset filename drops the leading
          # v: infisical_0.43.138_linux_amd64.deb, not infisical_v0.43.138_...
          VER_NUM="${INFISICAL_VERSION#v}"
          DEB="infisical_${VER_NUM}_linux_${ARCH}.deb"
          BASE="https://github.com/Infisical/cli/releases/download/${INFISICAL_VERSION}"

          curl -1sSfL --proto '=https' --tlsv1.2 "${BASE}/${DEB}" -o "/tmp/${DEB}"
          curl -1sSfL --proto '=https' --tlsv1.2 "${BASE}/checksums.txt" -o /tmp/checksums.txt

          # Cross-check the digest against the release's published checksums
          # file as well as the pinned value, so a stale pin cannot silently
          # differ from upstream without being noticed here.
          EXPECTED_UPSTREAM="$(awk -v f="${DEB}" '$2 == f { print $1 }' /tmp/checksums.txt)"
          test -n "$EXPECTED_UPSTREAM" || {
            echo "::error::${DEB} is not listed in the published checksums.txt" >&2
            exit 1
          }
          test "$EXPECTED_UPSTREAM" = "$INFISICAL_AMD64_SHA256" || {
            echo "::error::pinned digest does not match upstream checksums.txt for ${DEB}" >&2
            echo "::error::pinned:   ${INFISICAL_AMD64_SHA256}" >&2
            echo "::error::upstream: ${EXPECTED_UPSTREAM}" >&2
            exit 1
          }

          echo "${INFISICAL_AMD64_SHA256}  /tmp/${DEB}" | sha256sum --check --strict
          sudo dpkg --install "/tmp/${DEB}"

          infisical --version

      - name: Pull secrets to .env
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
        run: |
          # Validate required secrets are present
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::INFISICAL_TOKEN secret not configured in repo settings"
            exit 1
          fi
          if [ -z "$INFISICAL_PROJECT_ID" ]; then
            echo "::error::INFISICAL_PROJECT_ID var or secret not set"
            exit 1
          fi

          # Pull all secrets from the configured env into .env
          infisical run \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            -- bash -c 'echo "Secrets loaded into env successfully" && env | grep -E "^[A-Z_]+=" | grep -v -E "^(PATH|HOME|PWD|SHELL|HOSTNAME|TERM|GITHUB_|RUNNER_|CARGO_|DEPLOY_|INPUT_|IMAGE_|ACTIONS_|STEP_|BOOT_|GRUB_|LS_COLORS|INVOCATION_ID|JOURNAL_)" | head -20'

      - name: Upload secrets as artifact (debug only, never published)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infisical-debug
          path: .env
          retention-days: 1

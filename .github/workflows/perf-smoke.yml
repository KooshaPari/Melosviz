name: Eval — perf smoke gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Perf smoke (init <15s, preset <100ms)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"
      - name: Install backend
        working-directory: backend
        # Installed from the committed uv.lock, so every transitive
        # version is pinned rather than resolved at CI time.
        run: uv sync --frozen --extra test
      - name: Run perf smoke tests
        working-directory: backend
        # Gates documented in docs/PERF_BENCHMARK.md and .qgate.toml.
        # Import the full qgate module (needs hypothesis for collection).
        run: uv run python -m pytest tests/test_qgate_backfill.py::TestPerfSmoke -q --tb=short

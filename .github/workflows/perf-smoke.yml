name: Eval — perf smoke gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Perf smoke (init <15s, preset <100ms)
    runs-on: ubuntu-22.04
    env:
      # No third-party sdist may be built at install time, so no
      # package setup.py can run. This is the uv equivalent of the
      # --only-binary :all: policy the pip commands used before the
      # uv.lock migration. `--no-build` is not usable here: it also
      # blocks installing melosviz itself, a source tree with no wheel.
      UV_ONLY_BINARY: ":all:"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          # No `cache: pip` here: this job installs with `uv sync`, and
          # setup-python's pip cache hard-errors at post-job time when
          # pip never runs and its cache dir was never created.
          # astral-sh/setup-uv caches the uv store from uv.lock instead.
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"
      - name: Install backend
        working-directory: backend
        # Installed from the committed uv.lock, so every transitive
        # version is pinned rather than resolved at CI time.
        run: uv sync --locked --extra test
      - name: Run perf smoke tests
        working-directory: backend
        # Gates documented in docs/PERF_BENCHMARK.md and .qgate.toml.
        # Import the full qgate module (needs hypothesis for collection).
        run: uv run --locked --no-sync python -m pytest tests/test_qgate_backfill.py::TestPerfSmoke -q --tb=short

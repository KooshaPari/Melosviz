name: studio-pipeline-tests

on:
  push:
    branches: [feat/comfyui-studio-pivot, main]
    paths:
      - "backend/**"
      - "desktop/**"
      - "web/**"
      - ".github/workflows/studio-tests.yml"
  pull_request:
    branches: [main]

jobs:
  backend-pytest:
    name: backend pytest (depth layer + studio pipeline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install system deps (ffmpeg for loudnorm + dither tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install backend package
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" --only-binary :all:
      - name: Run pytest (depth layer + studio pipeline, no slow e2e)
        working-directory: backend
        run: |
          python -m pytest \
            tests/conductor/ \
            tests/compose/ \
            tests/llm/ \
            tests/render/ \
            tests/test_cli.py \
            tests/test_direct_subcommand.py \
            tests/test_multi_tool_adapters.py \
            tests/test_studio_pipeline_adapters.py \
            -q --no-header --timeout=60 \
            -k "not test_render_events_stream_returns_event_stream_content_type"
      - name: Run pytest (full studio pipeline e2e + 3-min pipeline, slow)
        working-directory: backend
        run: |
          python -m pytest tests/test_e2e_3min_pipeline.py -q --no-header --timeout=120 -m slow
        continue-on-error: true

  backend-bridge-pytest:
    name: backend pytest (bridge SSE + studio pipeline endpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend package
        working-directory: backend
        run: |
          python -m pip install -e ".[test]" --only-binary :all:
          python -m pip install python-multipart==0.0.32 --only-binary :all:
      - name: Run pytest (bridge, skip the known-hanging SSE stream test)
        working-directory: backend
        run: |
          python -m pytest tests/test_bridge_studio_pipeline.py \
            -q --no-header --timeout=30 \
            -k "not test_render_events_stream_returns_event_stream_content_type"

  web-vitest:
    name: web vitest (StudioConsole + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        working-directory: web
        # --frozen-lockfile makes this a real assertion: it fails if
        # web/bun.lock does not already satisfy package.json, so CI installs
        # exactly the committed resolution and nothing else.
        #
        # That is only true at the bun version pinned above, and the lockfile
        # format is what makes it true. web/bun.lock is lockfileVersion 1
        # because that is the newest format bun 1.3.14 writes. The lock was
        # briefly regenerated into lockfileVersion 3, which no 1.x bun before
        # 1.4 can parse: 1.1.34 then ignores bun.lock entirely and falls back
        # to web/package-lock.json, and 1.2/1.3 fail with "Unknown lockfile
        # version". Both outcomes make this step pass without reading the
        # lock, so the assertion silently stopped meaning anything. Verified by
        # pinning vitest to 99.99.99 inside the lock: 1.1.34 installed clean,
        # 1.3.14 fails with a 404 on the tarball.
        #
        # Do NOT raise the pin to 1.4.x without also passing
        # --linker=isolated. 1.4.0 regressed into refusing the
        # file:../packages/* workspace deps (oven-sh/bun#40561) on Linux as
        # well as Windows; --linker=isolated works around it but changes
        # node_modules layout, so it is a worse trade than staying on 1.3.14.
        #
        # web/package-lock.json is deliberately kept and is unrelated to this
        # step: ci.yml and a11y.yml run `npm ci` against it for the a11y job.
        # bun never reads it now that the lock is v1.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run vitest (StudioConsole component)
        working-directory: web
        # Not advisory. This suite is the only thing that runs the StudioConsole
        # component in CI, so leaving it on continue-on-error let a red suite
        # pass while the job reported success. Verified green on the pinned
        # lockfile (13/13) before removing the flag.
        #
        # Do NOT add `--bun` here. vite@8.2.2 does
        # `import { parseEnv } from "node:util"`, and util.parseEnv is a
        # Node >= 20.12 API that Bun 1.3.14 (the version pinned above) does not
        # implement, so forcing the vitest process onto Bun's runtime dies at
        # startup with "Export named 'parseEnv' not found in module 'util'".
        # Plain `bunx` runs vitest on Node, where the import resolves.
        run: bunx vitest run src/components/__tests__/StudioConsole.test.tsx
      - name: Typecheck
        working-directory: web
        run: bunx tsc --noEmit -p tsconfig.json
        continue-on-error: true

  desktop-bun:
    name: desktop bun test + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        working-directory: desktop
        # Same assertion as the web job above, and this one was already
        # genuine: desktop/bun.lock is lockfileVersion 1, which bun 1.1.34
        # parses. Confirmed by pinning electrobun to 99.99.99 in the lock,
        # which fails the install with a 404.
        #
        # The lock was stale on main (electrobun 1.18.1 against a package.json
        # asking for ^2.0.1) and is regenerated in this branch.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run bun test (renderBinary helper)
        working-directory: desktop
        run: bun test src/renderBinary.test.ts
      - name: Typecheck
        working-directory: desktop
        run: bunx tsc --noEmit -p tsconfig.json
        continue-on-error: true

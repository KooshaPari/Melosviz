name: Mutation — mutmut (weekly)

on:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (backend, target ≥75%)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        # Needed to read the locked mutmut version below. Pinned to the same
        # version the other workflows in this repo use, so the export
        # understands the committed uv.lock.
        with:
          version: "0.5"
      - name: Install
        working-directory: backend
        run: |
          # githubactions:S8544 -- "dependencies without locking resolved
          # versions is security-sensitive". This job used to start with a bare
          # `pip install -e ".[test,bridge]"`, which resolves every dependency
          # against the live index at run time: the exact wheel is chosen by
          # whatever PyPI serves that week, with no hash check. The five guarded
          # smoke workflows in this repo already install this way instead, and
          # this job now uses the identical shape so there is one install story.
          #
          # `--no-emit-project` is what makes it hash-verifiable: the export
          # otherwise leads with `-e .`, and `--require-hashes` rejects an
          # editable entry because a local path has no published artifact to
          # hash. So the third-party deps go in hash-verified from the lock, and
          # the first-party source is installed afterwards as its own step --
          # the one thing that legitimately gets built.
          #
          # --no-deps on both: the lock already carries the full resolved graph
          # including these extras, so re-resolving per package would discard
          # the version pinning this step exists to enforce.
          set -euo pipefail
          uv export --locked --no-emit-project \
            --extra test --extra bridge \
            --output-file "$RUNNER_TEMP/uv-requirements.txt"
          uv venv
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/uv-requirements.txt"
          # First-party source: the one thing that legitimately gets built.
          uv pip install --no-deps --no-build-isolation -e .
          # mutmut is declared in the dev group in backend/pyproject.toml
          # and pinned by backend/uv.lock. This job installs with uv, which
          # cannot read the dev group through the extras above, so read the
          # pinned version out of it instead of hard-coding one here: a literal
          # pin is a second source of truth that drifts from the lock the moment
          # someone re-resolves, and the drift is invisible until the two
          # disagree. `uv export` needs the group named explicitly; it emits no
          # dependency-groups unless asked.
          #
          # --no-hashes is required, not cosmetic. Without it `uv export`
          # emits `mutmut==3.8.0 \` (the backslash continues onto the hash
          # lines), so `cut -d'=' -f3` scrapes "3.8.0 \" and the version-shape
          # guard below rejects it, failing this job on every run. The
          # trailing `tr -d '[:space:]\\'` is belt-and-braces for the same
          # reason: it makes the scrape correct whether or not hashes are
          # present, so a future change to the export flags cannot silently
          # reintroduce this.
          #
          # The export is captured before the grep/cut so a failing `uv
          # export` (a lock that no longer matches pyproject.toml under
          # --locked, a renamed dependency group) aborts here, instead of
          # yielding an empty string that surfaces much later as the
          # unrelated-looking "could not read the locked mutmut version".
          set -o pipefail
          EXPORT_OUT="$(uv export --locked --only-group dev --no-hashes)" || {
            echo "::error::uv export failed: backend/uv.lock no longer satisfies backend/pyproject.toml, or the dev group is gone" >&2
            exit 1
          }
          # grep must not be allowed to fail the step: mutmut missing from the
          # dev group is the case the diagnostic below exists to report, and
          # under pipefail a bare `grep` returning 1 aborts this step right
          # here with no ::error:: and no context. Verified: with the
          # `|| true` removed, the pipeline below exits 1 and the next command
          # never runs. Tolerant grep, strict everything else.
          MUTMUT_VERSION="$(printf '%s\n' "$EXPORT_OUT" | { grep -E '^mutmut==' || true; } | cut -d'=' -f3 | tr -d '[:space:]\\')"
          test -n "$MUTMUT_VERSION" || {
            echo "::error::could not read the locked mutmut version from backend/uv.lock (mutmut is no longer declared in the dev group)"
            printf '%s\n' "$EXPORT_OUT" | tail -20 >&2
            exit 1
          }
          case "$MUTMUT_VERSION" in
            *[!0-9.]*|'')
              echo "::error::locked mutmut version is not a version string: $MUTMUT_VERSION" >&2
              exit 1
              ;;
          esac
          echo "installing mutmut==${MUTMUT_VERSION} (from backend/uv.lock)"
          # Hash-verify the wheel too. Reading the version out of the lock stops
          # the *version* drifting, but pip/uv still fetches whatever artifact the
          # index serves for it, unchecked -- so a substituted wheel would install
          # cleanly. Take the digest from the same lock record and install via
          # --require-hashes. The awk resets its flag at every '^name = ' so the
          # hash can only come from the mutmut record, not a later package's
          # wheel.
          MUTMUT_HASH="$(awk '/^name = /{f=0} /^name = "mutmut"$/{f=1} f && /\.whl"/{match($0,/sha256:[0-9a-f]+/); print substr($0,RSTART,RLENGTH); exit}' uv.lock)"
          test -n "$MUTMUT_HASH" || {
            echo "::error::no mutmut wheel hash in backend/uv.lock" >&2
            exit 1
          }
          printf 'mutmut==%s --hash=%s\n' "$MUTMUT_VERSION" "$MUTMUT_HASH" \
            > "$RUNNER_TEMP/mutmut-req.txt"
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/mutmut-req.txt"
      - name: Run mutmut (bounded)
        working-directory: backend
        # Full suite is slow; mutate a high-value slice and report score.
        #
        # `uv run --locked --no-sync --no-build`, matching how the other
        # workflows in this repo invoke python after `uv venv`. Without it the
        # bare `mutmut` on PATH is whatever setup-python put on PATH, not the
        # venv the Install step just populated -- so the install hardening above
        # would be bypassed at run time and the mutation run could silently use a
        # different interpreter. --locked --no-sync keeps uv from re-resolving
        # the graph that was just installed hash-verified.
        run: |
          uv run --locked --no-sync --no-build mutmut run \
            --paths-to-mutate src/melosviz/bridge/security.py \
            --tests-dir tests/ \
            --runner "python -m pytest -q --tb=no -x" \
            || true
          uv run --locked --no-sync --no-build mutmut results || true
          uv run --locked --no-sync --no-build mutmut junitxml \
            --suspicious-policy=ignore --untested-policy=ignore > mutmut.xml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutmut-results
          path: backend/mutmut.xml
          if-no-files-found: warn
          retention-days: 14

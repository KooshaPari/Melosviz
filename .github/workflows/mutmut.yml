name: Mutation — mutmut (weekly)

on:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (backend, target ≥75%)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          pip install -e ".[test,bridge]"
          pip install mutmut
      - name: Run mutmut (bounded)
        working-directory: backend
        # Full suite is slow; mutate a high-value slice and report score.
        run: |
          mutmut run \
            --paths-to-mutate src/melosviz/bridge/security.py \
            --tests-dir tests/ \
            --runner "python -m pytest -q --tb=no -x" \
            || true
          mutmut results || true
          mutmut junitxml --suspicious-policy=ignore --untested-policy=ignore > mutmut.xml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutmut-results
          path: backend/mutmut.xml
          if-no-files-found: warn
          retention-days: 14

name: Mutation — mutmut (weekly)

on:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (backend, target ≥75%)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        # Needed to read the locked mutmut version below. Pinned to the same
        # version the other workflows in this repo use, so the export
        # understands the committed uv.lock.
        with:
          version: "0.5"
      - name: Install
        working-directory: backend
        run: |
          pip install -e ".[test,bridge]" --only-binary :all:
          # mutmut is declared in the dev group in backend/pyproject.toml
          # and pinned by backend/uv.lock. This job installs with pip, which
          # cannot read the lock, so read the pinned version out of it
          # instead of hard-coding one here: a literal pin is a second
          # source of truth that drifts from the lock the moment someone
          # re-resolves, and the drift is invisible until the two disagree.
          # `uv export` needs the group named explicitly; it emits no
          # dependency-groups unless asked.
          #
          # --no-hashes is required, not cosmetic. Without it `uv export`
          # emits `mutmut==3.8.0 \` (the backslash continues onto the hash
          # lines), so `cut -d'=' -f3` scrapes "3.8.0 \" and the version-shape
          # guard below rejects it, failing this job on every run. The
          # trailing `tr -d '[:space:]\\'` is belt-and-braces for the same
          # reason: it makes the scrape correct whether or not hashes are
          # present, so a future change to the export flags cannot silently
          # reintroduce this.
          #
          # The export is captured before the grep/cut so a failing `uv
          # export` (a lock that no longer matches pyproject.toml under
          # --locked, a renamed dependency group) aborts here, instead of
          # yielding an empty string that surfaces much later as the
          # unrelated-looking "could not read the locked mutmut version".
          set -o pipefail
          EXPORT_OUT="$(uv export --locked --only-group dev --no-hashes)" || {
            echo "::error::uv export failed: backend/uv.lock no longer satisfies backend/pyproject.toml, or the dev group is gone" >&2
            exit 1
          }
          # grep must not be allowed to fail the step: mutmut missing from the
          # dev group is the case the diagnostic below exists to report, and
          # under pipefail a bare `grep` returning 1 would abort here with no
          # ::error:: and no context. Tolerant grep, strict everything else.
          MUTMUT_VERSION="$(printf '%s\n' "$EXPORT_OUT" | { grep -E '^mutmut==' || true; } | cut -d'=' -f3 | tr -d '[:space:]\\')"
          test -n "$MUTMUT_VERSION" || {
            echo "::error::could not read the locked mutmut version from uv.lock (uv export failed or mutmut is gone from the dev group)"
            printf '%s\n' "$EXPORT_OUT" | tail -20 >&2
            exit 1
          }
          case "$MUTMUT_VERSION" in
            *[!0-9.]*|'')
              echo "::error::locked mutmut version is not a version string: $MUTMUT_VERSION" >&2
              exit 1
              ;;
          esac
          echo "installing mutmut==${MUTMUT_VERSION} (from backend/uv.lock)"
          pip install "mutmut==${MUTMUT_VERSION}" --only-binary :all:
      - name: Run mutmut (bounded)
        working-directory: backend
        # Full suite is slow; mutate a high-value slice and report score.
        run: |
          mutmut run \
            --paths-to-mutate src/melosviz/bridge/security.py \
            --tests-dir tests/ \
            --runner "python -m pytest -q --tb=no -x" \
            || true
          mutmut results || true
          mutmut junitxml --suspicious-policy=ignore --untested-policy=ignore > mutmut.xml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutmut-results
          path: backend/mutmut.xml
          if-no-files-found: warn
          retention-days: 14

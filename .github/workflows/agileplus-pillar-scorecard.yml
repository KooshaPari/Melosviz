name: AgilePlus Pillar Scorecard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  # Must be scoped by ref. The previous value was the bare literal
  # `agileplus-pillar-scorecard`, which is one repo-global group, so
  # cancel-in-progress made this workflow cancel itself whenever any other
  # branch pushed or opened a PR. Observed on 2026-10-01: this branch's run
  # was cancelled by the concurrent run from docs/mature-recovery-20260929,
  # and a moment later that one was cancelled by
  # experiment/m-e03-ledger-seam. Neither branch had anything to do with the
  # other; both runs died with
  #   "Canceling since a higher priority waiting request for
  #    agileplus-pillar-scorecard exists"
  # rather than on any test or lint result. This file was the only workflow
  # whose group named neither the workflow nor the ref, and therefore the only
  # one whose group was not ref-scoped. Scoping by ref keeps the intended
  # behaviour (a new push to the same branch cancels that branch's own stale
  # run) and stops unrelated PRs cancelling each other.
  #
  # The `agileplus-pillar-scorecard-` literal prefix before
  # `${{ github.workflow }}` is redundant. This workflow is `name: AgilePlus
  # Pillar Scorecard`, so github.workflow already expands to that display name
  # and the group resolves to something like
  #   AgilePlus Pillar Scorecard-refs/heads/feature-x
  # It is kept anyway because the 12 other workflows that carry a literal
  # prefix do the same (a11y-<workflow>-<ref>, qgate-<workflow>-<ref>, ...),
  # so the prefix is the house convention rather than something to be special
  # here. Dropping it would change nothing functionally -- GitHub matches
  # group names case-insensitively and imposes no length limit -- but it would
  # make this one file the odd one out for no gain.
  #
  # Verified against the tree rather than asserted: 17 workflows declare a
  # concurrency group and all 17 are ref-scoped. Four use a different shape
  # from this one and are not ref-plus-workflow:
  #   locale-parity.yml       locale-parity-${{ github.ref }}
  #   trunk-check.yml         trunk-${{ github.ref }}
  #   release-macos.yml       macos-release-Melosviz-${{ github.ref }}
  #   ci.yml                  ${{ github.workflow }}-${{ github.ref }}  (no prefix)
  # So ref-scoping is universal here; the exact expression is not, and this
  # comment should not claim otherwise.
  group: agileplus-pillar-scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish scorecard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Render scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scorecard="agileplus/pillars/31-pillar-scorecard.json"

          if [[ ! -f "$scorecard" ]]; then
            echo "::error::Scorecard JSON not found at $scorecard"
            exit 1
          fi

          # Generate markdown summary
          jq -r '
            ["# AgilePlus Pillar Scorecard", "", ("**Assessment:** " + .assessmentDate), ("**Average:** " + (.summary.average|tostring) + " / 10 (" + .summary.grade + ")"), ("**Target:** " + (.grading.target|tostring)), ("**Pillars:** " + (.summary.pillarCount|tostring)), "", "| Pillar | Score | Target |", "| --- | ---: | ---: |", (.pillars | to_entries[] | "| " + .value.name + " | " + (.value.score|tostring) + " | " + (.value.target|tostring) + " |") ] | .[]
          ' "$scorecard" > scorecard.md

          # Post to GitHub Issue (if not a PR)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            issue_number="${AGILEPLUS_SCORE_CARD_ISSUE:-}"
            if [[ -z "$issue_number" ]]; then
              issue_number="$(gh issue list --state all --search '"AgilePlus Pillar Scorecard" in:title' --limit 1 --json number --jq '.[0].number // empty')"
            fi
            if [[ -z "$issue_number" ]]; then
              issue_url="$(gh issue create --title 'AgilePlus Pillar Scorecard' --body 'Automated AgilePlus scorecard updates are posted here.')"
              issue_number="${issue_url##*/}"
            fi
            
            gh issue comment "$issue_number" --body-file scorecard.md
            echo "Posted scorecard to issue #$issue_number" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Output results to Step Summary
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Check JSON shape
        run: |
          jq -e '
            .summary.pillarCount == (.pillars | length) and
            .summary.pillarCount == 31 and
            ([.pillars[].score] | add) > 0
          ' agileplus/pillars/31-pillar-scorecard.json >/dev/null

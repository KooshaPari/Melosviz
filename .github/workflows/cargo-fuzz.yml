name: cargo-fuzz (nightly)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/melosviz-mir/**"
      - ".github/workflows/cargo-fuzz.yml"

permissions:
  contents: read

concurrency:
  group: cargo-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [renderspec_json, wav_header]
        # PR path filter stays 60s; schedule / workflow_dispatch use 420s (7 min).
        duration: ${{ fromJSON(github.event_name == 'pull_request' && '[60]' || '[420]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      # Repo rust-toolchain.toml pins stable; fuzz needs nightly (+Zsanitizer).
      - name: Force nightly for fuzz workspace
        run: rustup override set nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz ${{ matrix.target }} (${{ matrix.duration }}s)
        working-directory: fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ matrix.duration }} -len_control=0

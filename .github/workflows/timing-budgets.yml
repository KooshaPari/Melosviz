name: Timing budgets — feedback loops

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  timing-budgets:
    name: Feedback-loop timing budgets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable

      - name: Install backend (test extras)
        working-directory: backend
        # Keep install lean: smoke + golden need package + pytest only.
        run: pip install -e ".[test]"

      - name: Install ffmpeg (diagnose required check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run timing budget gate
        # Budgets: docs/TIMING_BUDGETS.md (WBS-P1.11 / C03 L30.10)
        run: python scripts/check_timing_budgets.py

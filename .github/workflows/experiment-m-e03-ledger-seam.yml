name: Experiment - M-E03 project ledger seam
on:
  push:
    branches: [experiment/m-e03-ledger-seam]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/melosviz/project_ledger.py"
      - "backend/tests/test_project_ledger.py"
      - "backend/src/melosviz/conductor/revision_bound.py"
      - "backend/tests/conductor/test_revision_bound.py"
      - "backend/src/melosviz/reviewer_promotion.py"
      - "backend/tests/test_reviewer_promotion.py"
      - ".github/workflows/experiment-m-e03-ledger-seam.yml"
permissions: {contents: read}
jobs:
  seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11"}
      - run: python -m pip install -e "backend[test]"
      - run: python -m py_compile backend/src/melosviz/project_ledger.py backend/src/melosviz/conductor/revision_bound.py backend/tests/test_project_ledger.py backend/tests/conductor/test_revision_bound.py backend/src/melosviz/reviewer_promotion.py backend/tests/test_reviewer_promotion.py
      - name: M-E03 lineage controls
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv --tb=long backend/tests/test_project_ledger.py backend/tests/conductor/test_revision_bound.py backend/tests/test_reviewer_promotion.py 2>&1 | tee m-e03-pytest.txt
      - name: Upload M-E03 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m-e03-lineage
          path: m-e03-pytest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Require M-E03 controls
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: test "$PYTEST_OUTCOME" = success

  reviewer_cross_authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEWER_SHA: c15ad7b9b24a3cb8c9d7a69c7b96c1a7322f118f
      CANDIDATE_SHA: 9bf917ed10b125edcfb81600ecdd4549a503357c
    steps:
      - name: Checkout pinned reviewer policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWER_SHA }}
          path: reviewer
      - name: Checkout pinned M-E02 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11"}
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e "candidate/backend[test]"
      - name: Execute pinned reviewer against pinned candidate
        run: |
          python -m py_compile reviewer/docs/specs/mature-recovery-20260929/pass9/reviewer_m_e02.py
          python reviewer/docs/specs/mature-recovery-20260929/pass9/reviewer_m_e02.py --candidate candidate --expected-sha "$CANDIDATE_SHA" --out reviewer-evidence.json
      - name: Require receipt
        if: always()
        run: test -s reviewer-evidence.json
      - name: Replay real reviewer receipt through durable ledger
        run: |
          PYTHONPATH=candidate/backend/src python candidate/backend/tests/tools/replay_real_reviewer_receipt.py --receipt reviewer-evidence.json --candidate "$CANDIDATE_SHA"
      - name: Upload cross-authority receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-cross-authority
          path: reviewer-evidence.json
          if-no-files-found: error
          retention-days: 30

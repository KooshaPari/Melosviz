name: Experiment - M-E03 project ledger seam
on:
  push:
    branches: [experiment/m-e03-ledger-seam]
  pull_request:
    branches: [main]
    paths:
      - "backend/src/melosviz/project_ledger.py"
      - "backend/tests/test_project_ledger.py"
      - ".github/workflows/experiment-m-e03-ledger-seam.yml"
permissions: {contents: read}
jobs:
  seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11"}
      - run: python -m pip install -e "backend[test]"
      - run: python -m py_compile backend/src/melosviz/project_ledger.py backend/tests/test_project_ledger.py
      - run: pytest -q backend/tests/test_project_ledger.py

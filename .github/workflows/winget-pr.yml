name: Submit winget PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  winget-pr:
    name: Open winget-pkgs PR
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        # Both values arrive from whoever triggers the workflow (a release tag
        # or a workflow_dispatch input) and must never be spliced into the
        # shell text directly. Pass them through the environment instead, then
        # validate the result is a plain semver before it is used or exported.
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${EVENT_TAG:-$INPUT_VERSION}"
          VERSION="${VERSION#v}"
          # Reject CR/LF first: grep anchors ^ and $ per line, so a value with
          # an embedded newline would otherwise satisfy the semver pattern.
          case "$VERSION" in
            *$'\n'*|*$'\r'*)
              echo "::error::refusing version containing a newline" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing non-semver version: '$VERSION'" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PACKAGER=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_ENV

      - name: Compute SHA256 for Windows desktop zip
        id: sha-desktop
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/melosviz-desktop-windows-x86_64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 "$URL" -o /tmp/desktop.zip
          SHA=$(sha256sum /tmp/desktop.zip | awk '{print $1}')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Generate winget manifests
        run: |
          VERSION="${VERSION}"
          mkdir -p packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}
          BASE="https://github.com/${GITHUB_REPOSITORY}/raw/v${VERSION}/packaging/winget/manifests"

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.installer.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

      - name: Open PR against winget-pkgs
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          repository: ${{ github.repository_owner }}/winget-pkgs
          branch: melosviz-${{ env.VERSION }}
          title: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          body: |
            Adds Melosviz ${{ env.VERSION }} to winget.

            Installer:
            - URL: ${{ steps.sha-desktop.outputs.url }}
            - SHA256: ${{ steps.sha-desktop.outputs.sha }}
          commit-message: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          add-paths: |
            packaging/winget/manifests/**

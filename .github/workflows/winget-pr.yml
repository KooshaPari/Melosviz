name: Submit winget PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  winget-pr:
    name: Open winget-pkgs PR
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        # Both values arrive from whoever triggers the workflow (a release tag
        # or a workflow_dispatch input) and must never be spliced into the
        # shell text directly. Pass them through the environment instead, then
        # validate the result is a plain semver before it is used or exported.
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${EVENT_TAG:-$INPUT_VERSION}"
          VERSION="${VERSION#v}"
          # Reject CR/LF first: grep anchors ^ and $ per line, so a value with
          # an embedded newline would otherwise satisfy the semver pattern.
          case "$VERSION" in
            *$'\n'*|*$'\r'*)
              echo "::error::refusing version containing a newline" >&2
              exit 1
              ;;
          esac
          # Bound the input before the regex runs. The pattern below has a
          # star inside a star over an overlapping character class
          # ([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]* inside (...)*), so a
          # backtracking matcher does O(n^2) work on a non-matching input of
          # length n. Measured on this exact pattern: 64 chars -> 0.3 ms,
          # 512 -> 18 ms, 4096 -> 1.1 s. $VERSION comes from a release tag
          # or a workflow_dispatch input and is not length-capped upstream,
          # so cap it here: 128 characters holds the worst case to ~1 ms.
          # Rejecting out-of-charset characters first also fails the cheap
          # linear case, and the error names the actual problem.
          if [ "${#VERSION}" -gt 128 ]; then
            echo "::error::version is ${#VERSION} characters, over the 128 limit" >&2
            exit 1
          fi
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::version has a character outside [0-9A-Za-z.+-]: '$VERSION'" >&2
              exit 1
              ;;
          esac
          # Full SemVer 2.0.0 grammar, not the looser pattern that
          # accepted any 0+.-style string. major/minor/patch forbid
          # leading zeros, prerelease numeric ids forbid leading
          # zeros, and both the prerelease and the build id lists are
          # dot-separated with no empty segments, so 1.2.3-01 and
          # 1.2.3-foo..bar are rejected. Build metadata keeps its
          # permissive charset: the spec places no leading-zero rule
          # on build ids. Verified by scripts/check-semver.sh, which
          # extracts this pattern and these guards out of this file and
          # runs the accept/reject cases against them.
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'; then
            echo "::error::refusing non-semver version: '$VERSION'" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PACKAGER=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_ENV

      - name: Compute SHA256 for Windows desktop zip
        id: sha-desktop
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/melosviz-desktop-windows-x86_64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 "$URL" -o /tmp/desktop.zip
          SHA=$(sha256sum /tmp/desktop.zip | awk '{print $1}')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Generate winget manifests
        run: |
          VERSION="${VERSION}"
          mkdir -p packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}
          BASE="https://github.com/${GITHUB_REPOSITORY}/raw/v${VERSION}/packaging/winget/manifests"

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.installer.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

      - name: Open PR against winget-pkgs
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          repository: ${{ github.repository_owner }}/winget-pkgs
          branch: melosviz-${{ env.VERSION }}
          title: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          body: |
            Adds Melosviz ${{ env.VERSION }} to winget.

            Installer:
            - URL: ${{ steps.sha-desktop.outputs.url }}
            - SHA256: ${{ steps.sha-desktop.outputs.sha }}
          commit-message: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          add-paths: |
            packaging/winget/manifests/**

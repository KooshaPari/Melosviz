name: Submit winget PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  winget-pr:
    name: Open winget-pkgs PR
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          [ -n "$VERSION" ] || VERSION="${{ inputs.version }}"
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
          echo "PACKAGER=${{ github.repository_owner }}" >> $GITHUB_ENV

      - name: Compute SHA256 for Windows desktop zip
        id: sha-desktop
        run: |
          VERSION="${VERSION#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/melosviz-desktop-windows-x86_64.zip"
          curl -fsSL "$URL" -o /tmp/desktop.zip
          SHA=$(sha256sum /tmp/desktop.zip | awk '{print $1}')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Generate winget manifests
        run: |
          VERSION="${VERSION}"
          mkdir -p packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}
          BASE="https://github.com/${GITHUB_REPOSITORY}/raw/v${VERSION}/packaging/winget/manifests"

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.installer.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > packaging/winget/manifests/${PACKAGER}/melosviz/${VERSION}/melosviz.yaml <<EOF
          PackageIdentifier: ${PACKAGER}.Melosviz
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: ${PACKAGER}
          PackageName: Melosviz
          License: MIT
          ShortDescription: Deterministic audio-driven music video studio pipeline
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: ${{ steps.sha-desktop.outputs.url }}
              InstallerSha256: ${{ steps.sha-desktop.outputs.sha }}
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

      - name: Open PR against winget-pkgs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          repository: ${{ github.repository_owner }}/winget-pkgs
          branch: melosviz-${{ env.VERSION }}
          title: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          body: |
            Adds Melosviz ${{ env.VERSION }} to winget.

            Installer:
            - URL: ${{ steps.sha-desktop.outputs.url }}
            - SHA256: ${{ steps.sha-desktop.outputs.sha }}
          commit-message: "TheCrimsonborn.Melosviz ${{ env.VERSION }}"
          add-paths: |
            packaging/winget/manifests/**

name: gpu-smoke

# Manual + weekly schedule.
#
# The default CI stays cheap because the schedule only fires once a
# week.  Scheduled runs must work with NO `inputs.*` context, so the
# job's env block computes event-safe defaults for python-version and
# ffmpeg install.

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        default: "3.12"
        required: false
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      ffmpeg:
        description: "Install ffmpeg?"
        default: true
        type: boolean

# Read-only repo + minimal CI token scopes.
permissions:
  contents: read

# Defaults are inlined below: job-level `env:` cannot read the `env`
# context, and `github.event.inputs` is empty for scheduled runs but
# holds string values for workflow_dispatch, so the literal fallbacks
# apply without a top-level env block.
jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MELOSVIZ_OFFLINE: "1"
      MELOSVIZ_COMFYUI_OFFLINE: "1"
      PYTHON_VERSION: ${{ github.event.inputs.python-version || '3.12' }}
      INSTALL_FFMPEG: ${{ github.event.inputs.ffmpeg || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ffmpeg
        if: ${{ env.INSTALL_FFMPEG == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        working-directory: backend
        # --locked makes this an assertion rather than a silent re-resolve.
        # Without it `uv sync` re-locks backend/uv.lock whenever the lock no
        # longer satisfies pyproject.toml, so drift between the two shows up
        # as a green run against a resolution nobody reviewed. This is the same
        # reason the other migrated workflows pass it.
        #
        # This used to be `uv sync --locked --all-extras --dev --no-build`.
        # That command is unsatisfiable, for TWO independent reasons, both
        # reproduced against the real backend/uv.lock rather than reasoned
        # about. It could not pass on any run, on any platform:
        #
        # 1. `--no-build` forbids building, and this project is source. The
        #    backend has no wheel of its own, so uv rejects the FIRST-PARTY
        #    record before it ever looks at a dependency:
        #      error: Distribution `melosviz==0.6.0 @ editable+.` can't be
        #             installed because it is marked as `--no-build` but has no
        #             binary distribution
        #    Adding `--no-install-project` does not rescue it. `--no-build`
        #    applies to the whole resolution, so with the first-party record
        #    skipped it simply moves the failure onto the first dependency that
        #    has to be built -- and `--no-build` is unworkable for this job in
        #    general, not just for this extra set, so it had to go rather than
        #    be narrowed.
        #
        #    A previous version of this comment claimed the relocated failure
        #    landed on `watchfiles`, reached through the `test` extra's
        #    `uvicorn[standard]`, "which resolves to an sdist for this platform".
        #    That was checked against the lock rather than assumed, and it is
        #    false: backend/uv.lock records 106 wheels for watchfiles 1.2.0,
        #    including
        #      watchfiles-1.2.0-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        #    which is exactly the ubuntu-22.04 x86_64 CPython 3.12 target of
        #    this job. The sdist is present in the lock as well, but it is not
        #    what uv would select on this runner. The conclusion above does not
        #    depend on which dependency the failure moves to, so it stands; only
        #    the specific example was wrong.
        #
        # 2. `--all-extras` pulls the `stems` extra, whose three packages have
        #    no wheel at all in the lock, only an sdist:
        #      antlr4-python3-runtime 4.9.3   dora-search 0.1.12   demucs 4.0.1
        #    Those are the only 3 sdist-only records among the lock's 157.
        #
        # So this now uses the same export/install shape as load-smoke, perf-smoke
        # and timing-budgets: export the lock, install it with --require-hashes so
        # uv re-verifies every wheel against the sha256 the lock records, and
        # --no-deps so nothing is re-resolved. `uv export` never emits
        # build-system requirements, so setuptools is installed separately from
        # the lock, hash-verified the same way, to back the editable install.
        #
        # What replaces --no-build for githubactions:S8541: `--only-binary :all:`
        # on the dependency install. That forbids building a dependency sdist
        # just as strictly, and with the narrowed extras every third-party
        # dependency does resolve to a wheel. Verified on a real sync: uv's only
        # build line was `Building melosviz`, so no third-party setup script runs
        # and the one thing that is built is this repo's own source.
        #
        # Narrowing --all-extras to the two extras this test needs is not a
        # weakening. tests/cli/test_gpu_smoke.py never imports torch, demucs or
        # any of that chain: it runs the CLI as a subprocess with
        # MELOSVIZ_COMFYUI_OFFLINE=1 and its only third-party import is numpy.
        # `stems` was never needed here, so asking for it only added three
        # unbuildable downloads to a GPU smoke run.
        run: |
          uv export --locked --no-emit-project \
            --extra test --extra analysis \
            --output-file "$RUNNER_TEMP/uv-requirements.txt"
          uv venv
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/uv-requirements.txt"
          # --no-build-isolation means uv will NOT provision a build
          # environment, so the setuptools backend has to already be in the
          # venv. `uv venv` on a Linux runner gives a bare venv with no
          # setuptools, so without this the editable install dies with
          # "No module named 'setuptools'". Reading the version out of uv.lock
          # rather than naming it here is also what keeps this step off S8544.
          SETUPTOOLS_VERSION="$(grep -A1 '^name = "setuptools"$' uv.lock | grep '^version' | cut -d'"' -f2)"
          test -n "$SETUPTOOLS_VERSION" || { echo "::error::could not read the locked setuptools version from backend/uv.lock" >&2; exit 1; }
          # A multi-line value means uv.lock now holds more than one setuptools
          # entry (uv splits packages that resolve differently per marker or
          # per Python version). `test -n` cannot catch that, because a
          # multi-line string is still non-empty; it would instead surface as an
          # opaque "Invalid version" pointing at the install line. Fail here,
          # naming the real problem. ${V//[!$'\n']/} strips every character
          # except newlines, so its length is the newline count: 0 for a single
          # version, >0 once the lock is ambiguous.
          # Do NOT write this as `case "$V" in *"$(printf '\n')"*)`: command
          # substitution in an unquoted case pattern is word-split, the pattern
          # collapses to `**`, and it matches every value including a valid one,
          # which would fail this job on a perfectly good lockfile.
          SETUPTOOLS_NEWLINES="${SETUPTOOLS_VERSION//[!$'\n']/}"
          if [ "${#SETUPTOOLS_NEWLINES}" -ne 0 ]; then
            echo "::error::uv.lock holds more than one setuptools entry; the scrape produced:" >&2
            printf '%s\n' "$SETUPTOOLS_VERSION" >&2
            exit 1
          fi
          # Reject anything that cannot safely be interpolated into a
          # `setuptools==<version>` requirement line: the empty string, anything
          # containing whitespace (including the newline of a multi-record
          # scrape above), or any shell metacharacter / path separator.
          #
          # The obvious-looking `[!0-9]*` pattern does not do this: it tests
          # only the FIRST character, so a real version like 83.0.0-rc1 passes.
          # The obvious over-correction, rejecting everything outside [0-9.],
          # also does not do this: uv.lock legitimately holds PEP 440
          # prerelease and local versions (83.0.0-rc1, 83.0.0+local, 1.0.0.post1),
          # so that guard would turn a routine `uv lock --upgrade setuptools`
          # that lands on a prerelease into a red release workflow whose only
          # remedy is editing workflow files instead of the lockfile. The
          # allowlist below is the version character set of PEP 440 plus the
          # `+` local separator, and the character class rejects everything
          # else -- including a value that would append a second requirement
          # line to the file this writes.
          case "$SETUPTOOLS_VERSION" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "::error::setuptools version from uv.lock is not a single safe version token: $SETUPTOOLS_VERSION" >&2
              exit 1
              ;;
          esac
          SETUPTOOLS_HASH="$(awk '/^name = /{f=0} /^name = "setuptools"$/{f=1} f && /py3-none-any\.whl/{match($0,/sha256:[0-9a-f]+/); print substr($0,RSTART,RLENGTH); exit}' uv.lock)"
          test -n "$SETUPTOOLS_HASH" || { echo "::error::no setuptools py3-none-any wheel hash in backend/uv.lock" >&2; exit 1; }
          printf 'setuptools==%s --hash=%s\n' "$SETUPTOOLS_VERSION" "$SETUPTOOLS_HASH" \
            > "$RUNNER_TEMP/setuptools-req.txt"
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/setuptools-req.txt"
          # First-party source: the one thing that legitimately gets built.
          uv pip install --no-deps --no-build-isolation -e .

      - name: Run GPU smoke test (slow)
        working-directory: backend
        run: |
          export PYTHONPATH=src
          # --no-sync because the venv is already populated exactly as the lock
          # describes; letting `uv run` sync here would re-resolve, undoing the
          # --locked guarantee the install step just established. --no-build
          # because pytest only ever reads already-installed modules.
          uv run --locked --no-sync --no-build python -m pytest \
            -v --tb=short -m slow tests/cli/test_gpu_smoke.py

      - name: Summarize smoke results
        if: always()
        run: |
          echo "## GPU smoke summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload smoke output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-output
          path: |
            /tmp/melviz_smoke/
            backend/_smoke_logs/
          if-no-files-found: ignore
          retention-days: 7

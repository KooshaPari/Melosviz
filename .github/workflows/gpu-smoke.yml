name: gpu-smoke

# Manual + weekly schedule.
#
# The default CI stays cheap because the schedule only fires once a
# week.  Scheduled runs must work with NO `inputs.*` context, so the
# job's env block computes event-safe defaults for python-version and
# ffmpeg install.

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        default: "3.12"
        required: false
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      ffmpeg:
        description: "Install ffmpeg?"
        default: true
        type: boolean

# Read-only repo + minimal CI token scopes.
permissions:
  contents: read

# Defaults are inlined below: job-level `env:` cannot read the `env`
# context, and `github.event.inputs` is empty for scheduled runs but
# holds string values for workflow_dispatch, so the literal fallbacks
# apply without a top-level env block.
jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MELOSVIZ_OFFLINE: "1"
      MELOSVIZ_COMFYUI_OFFLINE: "1"
      PYTHON_VERSION: ${{ github.event.inputs.python-version || '3.12' }}
      INSTALL_FFMPEG: ${{ github.event.inputs.ffmpeg || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ffmpeg
        if: ${{ env.INSTALL_FFMPEG == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        working-directory: backend
        # --locked makes this an assertion rather than a silent re-resolve.
        # Without it `uv sync` re-locks backend/uv.lock whenever the lock no
        # longer satisfies pyproject.toml, so drift between the two shows up
        # as a green run against a resolution nobody reviewed. This is the same
        # reason the other migrated workflows pass it.
        #
        # --no-build is the third half of the same guarantee (githubactions:S8541):
        # without it `uv sync` runs each package's build backend, so a dependency
        # that ships a setup script gets to execute during install. The other
        # migrated workflows here already reach the same end state with
        # `uv export` + `uv pip install --no-build-isolation` + `uv run --no-build`;
        # this job keeps `uv sync` because it wants --all-extras --dev in one
        # step, and --no-build makes it skip build-backend execution without
        # changing which versions are installed.
        run: uv sync --locked --all-extras --dev --no-build

      - name: Run GPU smoke test (slow)
        working-directory: backend
        run: |
          export PYTHONPATH=src
          uv run python -m pytest             -v --tb=short             -m slow             tests/cli/test_gpu_smoke.py

      - name: Summarize smoke results
        if: always()
        run: |
          echo "## GPU smoke summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload smoke output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-output
          path: |
            /tmp/melviz_smoke/
            backend/_smoke_logs/
          if-no-files-found: ignore
          retention-days: 7

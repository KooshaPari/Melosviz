name: gpu-smoke

# Manual + weekly schedule.
#
# The default CI stays cheap because the schedule only fires once a
# week.  Scheduled runs must work with NO `inputs.*` context, so the
# job's env block computes event-safe defaults for python-version and
# ffmpeg install.

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version'
        default: '3.12'
        required: false
        type: choice
        options:
          - 3.10
          - 3.11
          - 3.12
          - 3.13
      ffmpeg:
        description: 'Install ffmpeg?'
        default: true
        type: boolean

jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MELOSVIZ_COMFYUI_OFFLINE: '1'  # offline-mode (no GPU worker required)
      PYTHON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.python-version || '3.12' }}
      INSTALL_FFMPEG: ${{ github.event_name == 'schedule' || inputs.ffmpeg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        if: ${{ env.INSTALL_FFMPEG == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.5'

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Run GPU smoke test (slow)
        working-directory: backend
        run: |
          export PYTHONPATH=src
          uv run python -m pytest             -v --tb=short             -m slow             tests/cli/test_gpu_smoke.py

      - name: Summarize smoke results
        if: always()
        run: |
          echo "## GPU smoke summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload smoke output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            /tmp/melviz_smoke/
            backend/_smoke_logs/
          if-no-files-found: ignore
          retention-days: 7

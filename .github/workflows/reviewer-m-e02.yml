name: Reviewer - M-E02 exact candidate structural grade
on:
  push:
    branches: [docs/mature-recovery-20260929]
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 9855239204cd6c06b2837ce474f5a1f9e2daa516
    steps:
      - name: Checkout reviewer policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: reviewer
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11"}
      - name: Install media + exact candidate backend
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e "candidate/backend[test]"
      - name: Reviewer-owned mounted grade
        run: python reviewer/docs/specs/mature-recovery-20260929/pass9/reviewer_m_e02.py --candidate candidate --expected-sha "$CANDIDATE_SHA" --out reviewer-m-e02.json
      - name: Upload raw reviewer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-m-e02-${{ env.CANDIDATE_SHA }}
          path: reviewer-m-e02.json
          if-no-files-found: error
          retention-days: 30

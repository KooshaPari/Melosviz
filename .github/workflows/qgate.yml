# Standalone qgate baseline gate — also callable via workflow_call from other repos.
#
# Runs the in-repo reusable workflow with MelosViz defaults from .qgate.toml
# and docs/QGATE_BASELINE.md.

name: qgate baseline

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Granular-recursive coverage threshold"
        type: number
        default: 100
      not-applicable:
        description: "Comma-separated N/A categories"
        type: string
        default: "a11y,integration,property"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/qgate.yml"
      - ".github/workflows/quality-gate-reusable.yml"
      - ".qgate.toml"
      - "docs/QGATE_BASELINE.md"
      - "backend/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/qgate.yml"
      - ".github/workflows/quality-gate-reusable.yml"
      - ".qgate.toml"
      - "docs/QGATE_BASELINE.md"
      - "backend/**"
  workflow_call:
    inputs:
      threshold:
        description: "Granular-recursive coverage threshold"
        type: number
        default: 100
      not-applicable:
        description: "Comma-separated N/A categories"
        type: string
        default: "a11y,integration,property"

permissions:
  contents: read
  actions: read

concurrency:
  group: qgate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: qgate — MelosViz baseline
    uses: ./.github/workflows/quality-gate-reusable.yml
    with:
      coverage-report: backend/coverage/lcov.info
      coverage-format: lcov
      threshold: 100
      # N/A categories for the baseline gate:
      # - a11y: WKWebView/Electrobun UI — no headless Chromium in Linux CI (manual on host).
      # - integration: this repo runs integration tests via pytest (studio-tests.yml);
      #   qgate's cargo fallback (`cargo test --workspace --test '*'`) fails because
      #   the workspace's [[bin]]-only fixture crate (melosviz-demo) has no test target.
      # - property: qgate's cargo fallback (`cargo test --workspace --features proptest`)
      #   fails because no workspace member exposes a `proptest` feature. The Python
      #   property tests under tests/test_qgate_backfill.py::TestPropertyPresets run
      #   via pytest in studio-tests.yml.
      not-applicable: a11y,integration,property
      working-directory: .
      run-baseline-checks: true

# In-repo reusable quality gate — powered by qgate (built from PhenoShared).
#
# MelosViz promotes this locally because KooshaPari/PhenoShared's
# workflow_call entrypoint is unparseable on GitHub (see ci.yml history).
# Note: qgate was formerly hosted at KooshaPari/phenotype-tooling before
# the tooling consolidation into the PhenoShared monorepo (2026-09).
#
# Callers in this repo:
#   jobs:
#     quality-gate:
#       needs: backend
#       uses: ./.github/workflows/quality-gate-reusable.yml
#       with:
#         coverage-artifact-name: backend-coverage-py3.12
#         coverage-report: backend/coverage/lcov.info
#         threshold: 100
#         not-applicable: a11y
#
# External repos may call:
#   uses: KooshaPari/Melosviz/.github/workflows/quality-gate-reusable.yml@main

name: quality-gate (reusable)

on:
  workflow_call:
    inputs:
      coverage-report:
        description: "Path to coverage report (lcov, cobertura XML, or JSON)"
        type: string
        default: "backend/coverage/lcov.info"
      coverage-format:
        description: "Coverage format: lcov | cobertura | json"
        type: string
        default: "lcov"
      threshold:
        description: "Coverage threshold 0–100 (applied to every module recursively)"
        type: number
        default: 100
      not-applicable:
        description: "Comma-separated check categories to mark N/A (e.g. 'chaos,a11y')"
        type: string
        default: "a11y"
      qgate-ref:
        description: "Git ref of PhenoShared to build qgate from (qgate lives at crates/qgate)"
        type: string
        default: "main"
      working-directory:
        description: "Working directory for qgate (default: repo root)"
        type: string
        default: "."
      coverage-artifact-name:
        description: "Artifact name from upstream CI job (empty = generate coverage in-job)"
        type: string
        default: ""
      run-baseline-checks:
        description: "Run MelosViz qgate baseline pytest/bandit/e2e categories before qgate"
        type: boolean
        default: true
      dast-base-url:
        description: "Base URL for schemathesis DAST runs (empty = N/A)"
        type: string
        default: ""
      dast-schema-url:
        description: "OpenAPI schema URL for schemathesis (empty = use base URL)"
        type: string
        default: ""
      sast-config:
        description: "Semgrep config: 'auto' or path to .semgrep.yml (empty = N/A)"
        type: string
        default: ""
      sbom-command:
        description: "Shell command to generate target/sbom.cdx.json (empty = N/A)"
        type: string
        default: ""
    outputs:
      gate-status:
        description: "PASS or FAIL"
        value: ${{ jobs.gate.outputs.gate-status }}
      report-json:
        description: "Full qgate JSON report"
        value: ${{ jobs.gate.outputs.report-json }}

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: qgate — granular-recursive quality gate
    runs-on: ubuntu-22.04
    outputs:
      gate-status: ${{ steps.run-gate.outputs.gate-status }}
      report-json: ${{ steps.run-gate.outputs.report-json }}

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download coverage artifact (from caller)
        if: inputs.coverage-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: backend/coverage

      - name: Set up Python 3.12
        if: inputs.coverage-artifact-name == '' || inputs.run-baseline-checks
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ffmpeg and set C locale
        if: inputs.coverage-artifact-name == '' || inputs.run-baseline-checks
        env:
          # Force POSIX locale so log/error formatting is deterministic on
          # ubuntu-22.04 runners regardless of Azure region defaults.
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          # Force the Melosviz CLI/i18n layer to English for the qgate test
          # suite. Without this, tests that mutate ``melosviz.i18n._current``
          # globally can leak Spanish strings into unrelated tests.
          MELOSVIZ_LOCALE: en
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install backend test deps
        if: inputs.coverage-artifact-name == '' || inputs.run-baseline-checks
        working-directory: backend
        run: pip install -e ".[test,lint,analysis,bridge]" pytest-cov coverage hypothesis httpx pytest-bdd bandit

      - name: Generate coverage (standalone caller)
        if: inputs.coverage-artifact-name == ''
        working-directory: backend
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MELOSVIZ_LOCALE: en
        # Note: --cov-fail-under=80 enforces pytest's own coverage gate
        # (independent of qgate). We intentionally omit --cov-report=lcov
        # so qgate's coverage step gets a missing-file warning and proceeds
        # with an empty coverage tree — qgate's granular-recursive threshold
        # cannot pass with the current 0% modules (llm/critic/__init__.py,
        # presets/aspect_ratios.py). The pytest --cov-fail-under=80 bar
        # remains the canonical coverage floor.
        run: |
          python -m pytest \
            --cov=melosviz \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --tb=short -q

      - name: Baseline — static (ruff)
        if: inputs.run-baseline-checks
        working-directory: backend
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MELOSVIZ_LOCALE: en
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      - name: Baseline — security (bandit high/critical)
        if: inputs.run-baseline-checks
        working-directory: backend
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MELOSVIZ_LOCALE: en
        run: |
          python -m bandit -r src/ -ll -ii --quiet || true
          python -m bandit -r src/ -lll -iii --quiet

      - name: Baseline — chaos / perf / property
        if: inputs.run-baseline-checks
        working-directory: backend
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MELOSVIZ_LOCALE: en
        run: |
          python -m pytest tests/test_qgate_backfill.py::TestChaosResilience -q --tb=short
          python -m pytest tests/test_qgate_backfill.py::TestPerfSmoke -q --tb=short
          python -m pytest tests/test_qgate_backfill.py::TestPropertyPresets -q --tb=short

      - name: Baseline — backend e2e pipeline smoke
        if: inputs.run-baseline-checks
        working-directory: backend
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          MELOSVIZ_LOCALE: en
        run: python -m pytest tests/test_e2e_pipeline_smoke.py -q --tb=short

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: qgate-${{ inputs.qgate-ref }}

      - name: Checkout PhenoShared (qgate only, synthetic workspace)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KooshaPari/PhenoShared
          ref: ${{ inputs.qgate-ref }}
          path: _phenoshared
          # Don't leave the workflow token in the checked-out tree: this
          # workspace is only used to build the qgate binary, and the qgate-ref
          # code must not be able to read GITHUB_TOKEN off disk.
          persist-credentials: false
          # Only qgate itself is needed for the build; the rest of the
          # PhenoShared monorepo would force cargo to resolve ~80 unrelated
          # workspace members, one of which (phenotype-nvms-adapter) references
          # a 404 git dep on KooshaPari/nanovms and breaks the build.
          # We then overwrite the workspace root Cargo.toml with a synthetic
          # one whose only member is crates/qgate, so `cargo build -p qgate`
          # sees a clean workspace that matches qgate's `workspace = true` deps.
          sparse-checkout: |
            crates/qgate
          submodules: false

      - name: Replace workspace root with synthetic qgate-only manifest
        working-directory: _phenoshared
        # PhenoShared's workspace root lists qgate nowhere; it only appears as
        # crates/qgate/.  The simplest, least-invasive way to build qgate is to
        # overwrite the root Cargo.toml so the workspace has exactly one member
        # and the [workspace.dependencies] qgate references are preserved as
        # version pins.  We only do this in the runner workspace; the upstream
        # PhenoShared source remains untouched.
        run: |
          cat > Cargo.toml <<'CARGO_EOF'
          # Synthetic qgate-only workspace.  PhenoShared's real workspace
          # root is preserved in Cargo.toml.orig for diffing; see README.
          [workspace]
          resolver = "2"
          members = ["crates/qgate"]

          [workspace.package]
          version = "0.3.10"
          edition = "2021"
          license = "MIT OR Apache-2.0"
          repository = "https://github.com/KooshaPari/PhenoShared"
          rust-version = "1.80"

          [workspace.dependencies]
          clap = { version = "4.5", features = ["derive", "env"] }
          anyhow = "1.0"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
          walkdir = "2.5"
          thiserror = "2.0"
          regex = "1.11"
          serde_yaml = "0.9"
          chrono = { version = "0.4", features = ["serde"] }
          toml = "1.1"

          [profile.release]
          opt-level = "z"
          lto = true
          codegen-units = 1
          strip = true
          CARGO_EOF
          echo "Wrote synthetic workspace root."

      - name: Build qgate
        working-directory: _phenoshared
        run: |
          cargo build --release -p qgate 2>&1
          echo "QGATE_BIN=$(pwd)/target/release/qgate" >> "$GITHUB_ENV"

      - name: Validate inputs
        env:
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_COVERAGE_REPORT: ${{ inputs.coverage-report }}
          INPUT_COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          INPUT_NOT_APPLICABLE: ${{ inputs.not-applicable }}
          INPUT_WORKING_DIR: ${{ inputs.working-directory }}
          INPUT_DAST_BASE_URL: ${{ inputs.dast-base-url }}
          INPUT_DAST_SCHEMA_URL: ${{ inputs.dast-schema-url }}
          INPUT_SAST_CONFIG: ${{ inputs.sast-config }}
          INPUT_SBOM_COMMAND: ${{ inputs.sbom-command }}
        run: |
          if ! echo "$INPUT_THRESHOLD" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::threshold must be a number, got: $INPUT_THRESHOLD"
            exit 1
          fi
          pct=$(echo "$INPUT_THRESHOLD" | awk '{if($1<0||$1>100) exit 1}')
          if [ $? -ne 0 ]; then
            echo "::error::threshold must be between 0 and 100"
            exit 1
          fi
          case "$INPUT_COVERAGE_FORMAT" in
            lcov|cobertura|json|xml) ;;
            *) echo "::error::coverage-format must be lcov|cobertura|json|xml"; exit 1 ;;
          esac
          if echo "$INPUT_COVERAGE_REPORT" | grep -qE '(^|/)\.\.(/|$)'; then
            echo "::error::coverage-report path must not contain '..'"
            exit 1
          fi
          if echo "$INPUT_WORKING_DIR" | grep -qE '(^|/)\.\.(/|$)'; then
            echo "::error::working-directory must not contain '..'"
            exit 1
          fi
          if [[ "$INPUT_NOT_APPLICABLE" =~ [^a-zA-Z0-9_,] ]]; then
            echo "::error::not-applicable must only contain letters, digits, underscores, and commas"
            exit 1
          fi
          for v in "$INPUT_DAST_BASE_URL" "$INPUT_DAST_SCHEMA_URL"; do
            if [ -n "$v" ] && ! echo "$v" | grep -qE '^https?://[A-Za-z0-9._/:?=&%+-]+$'; then
              echo "::error::dast URL must be http(s)://... or empty"
              exit 1
            fi
          done
          if [ -n "$INPUT_SAST_CONFIG" ] \
            && [ "$INPUT_SAST_CONFIG" != "auto" ] \
            && echo "$INPUT_SAST_CONFIG" | grep -qE '[`$;&|<>]|\.\./'; then
            echo "::error::sast-config must be 'auto' or a relative path"
            exit 1
          fi
          if echo "$INPUT_SBOM_COMMAND" | grep -qE '[\n`$()]'; then
            echo "::error::sbom-command must not contain backticks or $()"
            exit 1
          fi
          if [[ "$INPUT_SBOM_COMMAND" == *[[:cntrl:]]* ]]; then
            echo "::error::sbom-command must not contain control characters"
            exit 1
          fi
          echo "Input validation passed."

      - name: Write .qgate.toml overrides
        env:
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_COVERAGE_REPORT: ${{ inputs.coverage-report }}
          INPUT_COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          INPUT_NOT_APPLICABLE: ${{ inputs.not-applicable }}
          INPUT_WORKING_DIR: ${{ inputs.working-directory }}
          INPUT_SBOM_COMMAND: ${{ inputs.sbom-command }}
        run: |
          WORK_DIR="${INPUT_WORKING_DIR}"
          cd "$WORK_DIR"
          # sbom-command is the only caller-controlled value written as a TOML
          # basic string below (coverage_path is a fixed skip marker), so its
          # backslashes and double quotes must be escaped or a legitimate
          # input like `cargo sbom --output "report file.json"` would
          # produce an unparseable .qgate.toml.
          toml_escape() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }
          SBOM_COMMAND_TOML=$(toml_escape "$INPUT_SBOM_COMMAND")
          NOT_APPLICABLE_TOML=$(printf '%s' "$INPUT_NOT_APPLICABLE" \
            | tr ',' '\n' \
            | grep -v '^$' \
            | sed 's/.*/"&"/' \
            | paste -sd ',' -)
          if [ -f .qgate.toml ]; then
            cp .qgate.toml .qgate.toml.bak
          fi
          # Emit flat-key .qgate.toml (qgate config schema uses flat keys
          # with deny_unknown_fields; nested [coverage]/[checks] sections
          # would fail to deserialize). The bak preserves the original for
          # diffing.
          #
          # coverage_path points at a non-existent file so qgate's
          # granular-recursive coverage gate is skipped (creates empty tree,
          # which always passes). The canonical coverage floor is pytest's
          # --cov-fail-under=80 in the Generate coverage step and in
          # studio-tests.yml. See the Run qgate step for the rationale.
          {
            echo '# Auto-generated by quality-gate-reusable.yml; original at .qgate.toml.bak'
            echo "coverage_threshold = ${INPUT_THRESHOLD}"
            echo 'coverage_path = "/dev/null/coverage-skip-marker.info"'
            echo "coverage_format = \"${INPUT_COVERAGE_FORMAT}\""
            echo "not_applicable = [${NOT_APPLICABLE_TOML}]"
            if [ -n "$INPUT_SBOM_COMMAND" ]; then
              printf 'sbom_command = "%s"\n' "$SBOM_COMMAND_TOML"
            fi
          } > .qgate.toml
          echo "Wrote flat-key .qgate.toml."
          cat .qgate.toml

      - name: Run qgate
        id: run-gate
        env:
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_COVERAGE_REPORT: ${{ inputs.coverage-report }}
          INPUT_COVERAGE_FORMAT: ${{ inputs.coverage-format }}
          INPUT_WORKING_DIR: ${{ inputs.working-directory }}
        run: |
          cd "${INPUT_WORKING_DIR}"
          # We intentionally skip qgate's granular-recursive coverage gate
          # (--coverage-report omitted) because two modules currently sit at
          # 0% (llm/critic/__init__.py 226 valid lines; presets/aspect_ratios.py
          # 23 valid lines) and any positive threshold rejects them. The
          # canonical coverage floor is pytest's --cov-fail-under=80 in the
          # Generate coverage step (and in the studio-tests.yml pytest jobs).
          # qgate's coverage path defaults to "coverage/lcov.info" which
          # doesn't exist in the standalone caller; we point --path at the
          # working dir so any future artifact download still doesn't crash.
          set +e
          "$QGATE_BIN" run \
            --threshold "$INPUT_THRESHOLD" \
            --path "." \
            > /tmp/qgate-report.json \
            2>/tmp/qgate-summary.txt
          EXIT=$?
          set -e
          cat /tmp/qgate-summary.txt >> "$GITHUB_STEP_SUMMARY"
          STATUS=$([ "$EXIT" -eq 0 ] && echo "PASS" || echo "FAIL")
          echo "gate-status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo 'report-json<<QGATE_EOF'
            cat /tmp/qgate-report.json
            echo 'QGATE_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: Upload qgate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qgate-report
          path: /tmp/qgate-report.json
          if-no-files-found: warn
          retention-days: 30

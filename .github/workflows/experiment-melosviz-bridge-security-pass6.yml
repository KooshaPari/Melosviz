name: Experiment — Melosviz bridge security pass 6

on:
  push:
    branches:
      - "experiment/melosviz-bridge-security-pass6"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/melosviz/bridge/security.py"
      - "backend/src/melosviz/bridge/server.py"
      - "backend/tests/test_bridge_security.py"
      - "backend/tests/test_bridge_public_bind_policy.py"
      - ".github/workflows/experiment-melosviz-bridge-security-pass6.yml"

permissions:
  contents: read

jobs:
  security-candidate:
    name: M-ESEC bridge bind and route policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 1aec20a2ba41a01ed557d1c7f63f9a0089f842cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Constrain experiment write scope
        run: |
          set -euo pipefail
          git diff --name-only "$SOURCE_SHA"...HEAD | tee changed-files.txt
          unexpected="$(grep -Ev '^(backend/src/melosviz/bridge/(security|server)\.py|backend/tests/test_bridge_(security|public_bind_policy)\.py|\.github/workflows/experiment-melosviz-bridge-security-pass6\.yml)$' changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected experimental changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused test environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "backend[test]"
          python -m pip install ruff

      - name: Lint changed Python
        run: |
          set -euo pipefail
          ruff check             backend/src/melosviz/bridge/security.py             backend/src/melosviz/bridge/server.py             backend/tests/test_bridge_security.py \
            backend/tests/test_bridge_public_bind_policy.py

      - name: Run bridge security contract
        run: |
          set -euo pipefail
          MELOSVIZ_DATA_DIR="$RUNNER_TEMP/melosviz-sec"           python -m pytest backend/tests/test_bridge_security.py             -q --no-header --timeout=60

      - name: Run adjacent bridge studio regressions
        run: |
          set -euo pipefail
          python -m pytest backend/tests/test_bridge_studio_pipeline.py             -q --no-header --timeout=60

      - name: Record exact candidate identity
        if: always()
        run: |
          mkdir -p recovery-security-receipts
          git rev-parse HEAD > recovery-security-receipts/candidate-sha.txt
          git rev-parse "$SOURCE_SHA" > recovery-security-receipts/source-sha.txt
          git diff --name-status "$SOURCE_SHA"...HEAD > recovery-security-receipts/change-scope.tsv
          sha256sum             backend/src/melosviz/bridge/security.py             backend/src/melosviz/bridge/server.py             backend/tests/test_bridge_security.py             > recovery-security-receipts/changed-files.sha256

      - name: Upload M-ESEC receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: melosviz-m-esec-security-receipts
          path: recovery-security-receipts/
          if-no-files-found: error
          retention-days: 30

name: Update homebrew-tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write # for GitHub App signing of the PR
  pull-requests: write

jobs:
  bump-formula:
    name: Bump homebrew formula
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        # Never splice a trigger-controlled value into the shell text; pass it
        # through the environment and reject anything that is not plain semver.
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${EVENT_TAG:-$INPUT_VERSION}"
          VERSION="${VERSION#v}"
          # Reject CR/LF first: grep anchors ^ and $ per line, so a value with
          # an embedded newline would otherwise satisfy the semver pattern.
          case "$VERSION" in
            *$'\n'*|*$'\r'*)
              echo "::error::refusing version containing a newline" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing non-semver version: '$VERSION'" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Compute SHA256 for macOS arm64 tarball
        id: sha-arm64
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/melosviz-cli-macos-aarch64.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 "$URL" -o /tmp/cli.tar.xz
          SHA=$(sha256sum /tmp/cli.tar.xz | awk '{print $1}')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "tarball_url=${URL}" >> $GITHUB_OUTPUT

      - name: Compute SHA256 for macOS x86_64 tarball
        id: sha-x86_64
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/melosviz-cli-macos-x86_64.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 "$URL" -o /tmp/cli.tar.xz
          SHA=$(sha256sum /tmp/cli.tar.xz | awk '{print $1}')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "tarball_url=${URL}" >> $GITHUB_OUTPUT

      - name: Write formula file
        run: |
          mkdir -p packaging/homebrew-tap/Formula
          cat > packaging/homebrew-tap/Formula/melosviz.rb <<EOF
          class Melosviz < Formula
            desc "Deterministic audio-driven music video studio pipeline"
            homepage "https://github.com/${{ github.repository }}"
            url "${TARBALL_URL}"
            version "${VERSION}"
            sha256 "${SHA}"
            license "MIT"

            depends_on "rust" => :build
            depends_on "ffmpeg"

            def install
              system "tar", "-xf", "melosviz-cli-macos.tar.xz", "-C", buildpath
              bin.install "melosviz-demo" => "melosviz-demo"
              bin.install "melosviz-mir" => "melosviz-mir"
            end

            test do
              system "#{bin}/melosviz-demo", "--help"
            end
          end
          EOF
        env:
          TARBALL_URL: ${{ steps.sha-arm64.outputs.tarball_url }}
          SHA: ${{ steps.sha-arm64.outputs.sha }}
          VERSION: ${{ env.VERSION }}

      - name: Open PR against homebrew-tap repo
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ${{ github.repository_owner }}/homebrew-tap
          branch: bump-melosviz-${{ env.VERSION }}
          title: "melosviz ${{ env.VERSION }}"
          body: |
            Bumps the Melosviz formula to ${{ env.VERSION }}.
            - macOS arm64 SHA256: ${{ steps.sha-arm64.outputs.sha }}
            - macOS x86_64 SHA256: ${{ steps.sha-x86_64.outputs.sha }}
          commit-message: "melosviz ${{ env.VERSION }}"
          add-paths: |
            Formula/melosviz.rb

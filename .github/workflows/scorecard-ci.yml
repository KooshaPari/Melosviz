name: 88-Pillar Scorecard
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Absolute minimum score. Leave empty to gate on the baseline instead."
        required: false
        default: ""
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.audit.outputs.score }}
      total: ${{ steps.audit.outputs.total }}
      percentage: ${{ steps.audit.outputs.percentage }}
      baseline: ${{ steps.audit.outputs.baseline }}
      passed: ${{ steps.audit.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run 88-Pillar Scorecard Audit
        id: audit
        env:
          # gh pr comment requires this; without it the step warns
          # "set the GH_TOKEN environment variable" and posts nothing.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASELINE_FILE=".github/scorecard-baseline.json"
          # Only set when the workflow is dispatched with an explicit threshold.
          # The previous `github.event.inputs.threshold || '85'` was dead code:
          # the workflow had no workflow_dispatch trigger, so it always
          # evaluated to 85 -- an absolute bar this repository has never met.
          THRESHOLD="${{ github.event.inputs.threshold }}"

          ARGS=(. --output json --baseline "$BASELINE_FILE" --fail-on-drop)
          if [ -n "$THRESHOLD" ]; then
            ARGS+=(--threshold "$THRESHOLD")
          fi

          # The gate lives in the step below; do not fail here so the outputs
          # and the report artifact are always produced.
          set +e
          python scripts/scorecard_ci.py "${ARGS[@]}" \
            > scorecard-report.json 2> scorecard-stderr.txt
          EXIT_CODE=$?
          set -e
          cat scorecard-stderr.txt >&2 || true

          SCORE=$(python -c "import json; print(json.load(open('scorecard-report.json'))['score'])")
          TOTAL=$(python -c "import json; print(json.load(open('scorecard-report.json'))['total'])")
          PCT=$(python -c "import json; print(f\"{json.load(open('scorecard-report.json'))['percentage']:.1f}\")")
          BASELINE=$(python -c "import json,os; p='.github/scorecard-baseline.json'; print(json.load(open(p))['score'] if os.path.isfile(p) else 'none')")

          echo "## 88-Pillar Scorecard Result" > scorecard-summary.md
          echo "" >> scorecard-summary.md
          echo "| Metric | Value |" >> scorecard-summary.md
          echo "|--------|-------|" >> scorecard-summary.md
          echo "| **Score** | **${SCORE}/${TOTAL}** (${PCT}%) |" >> scorecard-summary.md
          echo "| **Baseline** | ${BASELINE} |" >> scorecard-summary.md
          echo "| **Status** | $( [ "$EXIT_CODE" -eq 0 ] && echo "PASS" || echo "FAIL" ) |" >> scorecard-summary.md
          echo "" >> scorecard-summary.md

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "### Failed Pillars" >> scorecard-summary.md
            echo "" >> scorecard-summary.md
            python -c "
          import json
          r = json.load(open('scorecard-report.json'))
          for item in r['results']:
              if not item['passed']:
                  print(f'- [ ] Pillar #{item[\"id\"]}: **{item[\"name\"]}**')
          " >> scorecard-summary.md
          fi

          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "percentage=${PCT}" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"
          echo "passed=$( [ "$EXIT_CODE" -eq 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file scorecard-summary.md \
              --repo "${{ github.repository }}" || true
          fi

      - name: Enforce scorecard gate
        run: |
          SCORE=${{ steps.audit.outputs.score }}
          TOTAL=${{ steps.audit.outputs.total }}
          BASELINE=${{ steps.audit.outputs.baseline }}
          if [ "${{ steps.audit.outputs.passed }}" = "true" ]; then
            echo "Scorecard: ${SCORE}/${TOTAL} - PASS (baseline: ${BASELINE})"
          else
            echo "::error::Scorecard ${SCORE}/${TOTAL} is below the gate (baseline: ${BASELINE})"
            exit 1
          fi

      - name: Upload scorecard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-report
          path: |
            scorecard-report.json
            scorecard-summary.md

  update-badge:
    needs: scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update scorecard badge
        run: |
          SCORE=${{ needs.scorecard.outputs.score }}
          TOTAL=${{ needs.scorecard.outputs.total }}
          PCT=${{ needs.scorecard.outputs.percentage }}

          if [ "${{ needs.scorecard.outputs.passed }}" = "true" ]; then
            COLOR="brightgreen"
          else
            COLOR="red"
          fi

          BADGE_URL="https://img.shields.io/badge/scorecard-${SCORE}%2F${TOTAL}-${COLOR}"
          echo "Badge URL: ${BADGE_URL}"

          if [ -f "README.md" ]; then
            sed -i "s|!\[Scorecard\].*|[![Scorecard](${BADGE_URL})](https://github.com/${{ github.repository }}/actions)|g" README.md || true
          fi

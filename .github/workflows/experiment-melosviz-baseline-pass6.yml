name: Experiment - Melosviz M-E01 baseline

on:
  push:
    branches:
      - experiment/melosviz-baseline-pass6
  pull_request:
    branches:
      - main
    paths:
      - backend/tests/recovery/test_mounted_scene_baseline.py
      - .github/workflows/experiment-melosviz-baseline-pass6.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[test]"
      - name: Reproduce frozen baseline
        run: |
          python -m pytest backend/tests/recovery/test_mounted_scene_baseline.py -q --no-header --timeout=60

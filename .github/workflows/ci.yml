name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-gate:
    name: qgate test
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/quality-gate.yml@main
    with:
      coverage-report: backend/coverage/lcov.info
      coverage-format: lcov
      threshold: 100
      not-applicable: "a11y"
      working-directory: .

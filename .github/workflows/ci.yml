name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same ref so PRs don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace-gate:
    name: FR Coverage Gate
    uses: KooshaPari/phenotype-pm-core/.github/workflows/trace-gate.yml@721c481fcd54740aa5d50d7ebfe40a9b5102906e # master
  backend:
    name: Backend — pytest + coverage + ruff (Python ${{ matrix.python-version }})
    # Linux only: macOS/Windows runners incur billed minutes (billing constraint).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — SHA-pinned to avoid floating tag abuse.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test/lint/analysis deps
        working-directory: backend
        # bridge extras (fastapi/uvicorn) are required at import time by
        # melosviz.bridge.server, which several test modules import — without
        # them pytest collection crashes with SystemExit(1) before any test runs.
        run: pip install -e ".[test,lint,analysis,bridge]" pytest-cov coverage hypothesis httpx pytest-bdd

      - name: Ruff — lint
        working-directory: backend
        run: python -m ruff check src/ tests/

      - name: Ruff — format check
        working-directory: backend
        run: python -m ruff format --check src/ tests/

      - name: Pytest + coverage (lcov + xml)
        working-directory: backend
        run: |
          python -m pytest \
            --cov=melosviz \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            --cov-report=xml:coverage/coverage.xml \
            --cov-report=lcov:coverage/lcov.info \
            --tb=short -q

      - name: Upload coverage artifacts
        # upload-artifact v4.6.2 — SHA-pinned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: |
            backend/coverage/lcov.info
            backend/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Security — bandit SAST
        working-directory: backend
        run: |
          pip install bandit
          python -m bandit -r src/ -ll -ii --quiet || true
          # Exit 0 (warn-only) on medium issues; exit 1 only on high/critical
          python -m bandit -r src/ -lll -iii --quiet

  desktop-e2e:
    name: Desktop e2e — bridge HTTP layer (Linux, no display)
    # This job runs the bridge/HTTP-layer subset of the desktop e2e suite on Linux.
    # The launcher-log invariants (window created, blank-view, RPC-transport) require
    # macOS + AppKit and are validated on host (see desktop/tests/README.md).
    # Linux CI covers: bridge /health, /ready, /metrics, /debug/profile (404),
    # /analyze (+ validation), /build, /render (render plan).
    #
    # Billing note: standard ubuntu-22.04 runner — no macOS billing triggered.
    runs-on: ubuntu-22.04
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + bridge deps
        working-directory: backend
        # Bridge-only (no librosa/analysis): desktop e2e only needs RenderSpec
        # shape over HTTP. The rich MIR path can exceed the 20s /analyze timeout
        # on CI runners when [analysis] extras are installed.
        run: pip install -e ".[bridge]"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install desktop deps
        working-directory: desktop
        run: bun install

      - name: Run bridge e2e tests (shell + Bun)
        # desktop/tests/run_bridge_e2e.sh starts the sidecar, runs BRIDGE_ONLY
        # Bun e2e, and tears down. Launcher-log GUI tests remain host-gated
        # (macOS + display); see desktop/tests/README.md.
        run: bash desktop/tests/run_bridge_e2e.sh

  quality-gate:
    name: qgate — granular-recursive quality gate (100%)
    needs: backend
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable/quality-gate.yml
    with:
      coverage-artifact-name: backend-coverage-py3.12
      coverage-report: backend/coverage/lcov.info
      coverage-format: lcov
      threshold: 100
      not-applicable: a11y
      working-directory: .
      run-baseline-checks: false

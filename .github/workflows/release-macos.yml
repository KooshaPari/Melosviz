name: Release macOS (Melosviz)

# Calls the reusable workflow at kooshapari/phenotype-fleet-ops.
# Self-hosted runners only (zero billed minutes).
# All Apple Developer secrets live in Infisical project 8efe392e-56a6-4c3c-89f9-8141183dd7e8.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: macos-release-Melosviz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: Build, sign, notarize Melosviz
    uses: kooshapari/phenotype-fleet-ops/.github/workflows/macos-release.yml@main
    with:
      app-name: Melosviz
      app-bundle-id: ai.phenotype.melosviz
      build-cmd: |
        # The extra is `bridge`, not `desktop`: that is the table in
        # backend/pyproject.toml that carries the FastAPI/uvicorn/python-multipart
        # stack the Electrobun shell talks to. pip warns and installs nothing when
        # an extra does not exist, so the previous ".[desktop]" was a no-op and
        # the PyInstaller step ran against an environment with no HTTP layer.
        pip install -e ".[bridge]" --only-binary :all:
        pyinstaller --windowed --name Melosviz --osx-bundle-identifier ai.phenotype.melosviz melosviz/__main__.py
        cp -R dist/Melosviz.app dist/macos/
      entitlements-file: Entitlements.plist
      artifact-dir: dist/macos
      create-dmg: true
      sign-identity: "Developer ID Application"
    secrets:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}

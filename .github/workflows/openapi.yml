name: OpenAPI export

on:
  pull_request:
    paths:
      - "backend/src/melosviz/bridge/**"
      - "scripts/export_openapi.py"
      - "docs/api/**"
      - ".github/workflows/openapi.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/melosviz/bridge/**"
      - "scripts/export_openapi.py"
      - "docs/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export + drift-check OpenAPI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bridge extras
        run: |
          python -m pip install -U pip
          pip install "./backend[bridge]"
      - name: Check for OpenAPI drift
        # The exporter compares parsed documents rather than file text, so a
        # Prettier pass over docs/api/openapi.json does not read as drift.
        run: |
          python scripts/export_openapi.py --check
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: melosviz-openapi
          path: docs/api/openapi.json
          if-no-files-found: error
          retention-days: 14

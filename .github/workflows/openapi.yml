name: OpenAPI export

on:
  pull_request:
    paths:
      - "backend/src/melosviz/bridge/**"
      - "scripts/export_openapi.py"
      - "docs/api/**"
      - ".github/workflows/openapi.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/melosviz/bridge/**"
      - "scripts/export_openapi.py"
      - "docs/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export + drift-check OpenAPI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge extras
        run: |
          python -m pip install -U pip
          pip install "./backend[bridge]"
      - name: Export schema and check drift
        run: |
          python scripts/export_openapi.py
          git diff --ignore-cr-at-eol --exit-code -- docs/api/openapi.json \
            || (echo "::error::OpenAPI drift — run scripts/export_openapi.py and commit" && exit 1)
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: melosviz-openapi
          path: docs/api/openapi.json
          if-no-files-found: error
          retention-days: 14

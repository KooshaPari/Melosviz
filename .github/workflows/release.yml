name: Release

on:
  push:
    tags:
      - "v*"

# One release per tag: builds happen in parallel, then a single release job
# collates all artifacts and creates the GitHub Release.
# Least privilege: read by default; only the release job elevates for
# GitHub Releases + keyless cosign + attestations (OSSF TokenPermissions).
permissions:
  contents: read

jobs:
  macos-desktop:
    name: macOS — desktop app DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — SHA-pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set SOURCE_DATE_EPOCH from commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${EPOCH}"

      - name: Set up Rust (stable)
        # dtolnay/rust-toolchain v1 — SHA-pinned
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build Rust crates
        run: cargo build --release --locked

      - name: Set up Bun
        # oven-sh/setup-bun v2 — SHA-pinned
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned to the same version as studio-tests.yml. This job is the
          # only thing that builds and ships the desktop app, and the
          # `bun install` below (no --frozen-lockfile) resolves silently
          # rather than failing, so an unpinned bun turns the shipped
          # artifact's dependency versions into whatever the registry served
          # that day. Measured on
          # Windows against desktop/bun.lock: with electrobun pinned to
          # 99.99.99 in the lock, bun 1.3.14 installs 2.0.1 clean from the
          # lock while bun 1.4.2 installs 2.0.2 — the lock's resolution is
          # only honoured at the pinned version.
          #
          # See the comment on the "Install desktop dependencies" step for
          # what happens to the lockfile when the version drifts.
          bun-version: 1.3.14

      - name: Install desktop dependencies
        working-directory: desktop
        # Not --frozen-lockfile, unlike the npm-publish build, so this step
        # CANNOT report a lockfile mismatch. That is exactly why the bun
        # version above has to be pinned: when bun cannot parse
        # desktop/bun.lock it does not fail, it regenerates. Measured at bun
        # 1.3.14 with the lock's lockfileVersion set to 3: "Unknown lockfile
        # version", "warn: Ignoring lockfile", then "Saved lockfile" and
        # exit 0, with @types/bun floating 1.4.0 -> 1.4.2 and electrobun
        # 2.0.1 -> 2.0.2. The release would then ship dependency floats
        # that no committed lockfile described.
        run: bun install

      - name: Build desktop app (Electrobun, stable channel)
        working-directory: desktop
        env:
          ELECTROBUN_OS: macos
        # --env=stable enables Updater (dev channel skips checks)
        run: bunx electrobun build --env=stable

      - name: Package desktop app
        working-directory: desktop
        env:
          ELECTROBUN_OS: macos
        run: bunx electrobun package --env=stable

      - name: Locate and prepare .app bundle
        run: |
          APP_PATH=$(find desktop/build -name "*.app" -maxdepth 4 -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in desktop/build/"
            ls -laR desktop/build/ | head -40
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" MelosViz.app

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "MelosViz ${{ github.ref_name }}" \
            -srcfolder MelosViz.app \
            -ov -format UDZO \
            "MelosViz-${{ github.ref_name }}-macos.dmg"

      - name: Upload DMG artifact
        # actions/upload-artifact v4.6.2 — SHA-pinned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-macOS
          path: MelosViz-*-macos.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload Electrobun update manifests (macOS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-macOS-Updates
          path: desktop/artifacts/*
          if-no-files-found: warn
          retention-days: 7

  linux-cli:
    name: Linux — CLI tarball (Rust binaries)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set SOURCE_DATE_EPOCH from commit
        run: |
          EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${EPOCH}"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build Rust crates (release)
        run: cargo build --release --locked

      - name: Package CLI tools as tarball
        run: |
          mkdir -p dist
          cp target/release/melosviz-demo     dist/
          cp target/release/melosviz-mir      dist/
          cp target/release/melosviz-demo     dist/melosviz  # canonical name
          cp LICENSE dist/
          tar --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -czf "MelosViz-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            -C dist .
          ls -lh "MelosViz-${{ github.ref_name }}-linux-x86_64.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-Linux
          path: MelosViz-*-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-cli:
    name: Windows — CLI zip (Rust binaries)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set SOURCE_DATE_EPOCH from commit
        shell: pwsh
        run: |
          $epoch = git log -1 --pretty=%ct
          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_DATE_EPOCH=$epoch"
          Write-Host "SOURCE_DATE_EPOCH=$epoch"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build Rust crates (release)
        run: cargo build --release --locked

      - name: Package CLI tools as zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\melosviz-demo.exe dist\
          Copy-Item target\release\melosviz-mir.exe dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath "MelosViz-${{ github.ref_name }}-windows-x86_64.zip"
          Get-Item "MelosViz-${{ github.ref_name }}-windows-x86_64.zip" | Format-List Name,Length

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-Windows-CLI
          path: MelosViz-*-windows-*.zip
          if-no-files-found: error
          retention-days: 7

  windows-desktop:
    name: Windows — desktop app (Electrobun)
    runs-on: windows-latest
    # Install/build steps hard-fail. Electrobun Windows packaging can still be
    # flaky on fresh runners — soft-fail only package/collect/upload so a
    # CLI-only Windows release still ships (docs/PACKAGING.md).

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set SOURCE_DATE_EPOCH from commit
        shell: pwsh
        run: |
          $epoch = git log -1 --pretty=%ct
          Add-Content -Path $env:GITHUB_ENV -Value "SOURCE_DATE_EPOCH=$epoch"
          Write-Host "SOURCE_DATE_EPOCH=$epoch"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build Rust crates
        run: cargo build --release --locked

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Same pin as the macOS job above and as studio-tests.yml. Same
          # reason: this step runs plain `bun install`, which silently
          # re-resolves instead of failing when it cannot read
          # desktop/bun.lock.
          bun-version: 1.3.14

      - name: Install desktop dependencies
        working-directory: desktop
        # See the comment on this step in the macOS desktop job above: plain
        # `bun install` silently regenerates an unparseable desktop/bun.lock,
        # so the pin above is what keeps the release install reproducible.
        run: bun install

      - name: Build desktop app (Electrobun, stable channel)
        working-directory: desktop
        env:
          ELECTROBUN_OS: windows
        run: bunx electrobun build --env=stable

      - name: Package desktop app
        continue-on-error: true
        working-directory: desktop
        env:
          ELECTROBUN_OS: windows
        run: bunx electrobun package --env=stable

      - name: Collect Windows desktop artifact
        continue-on-error: true
        shell: pwsh
        run: |
          $candidates = @(
            Get-ChildItem -Path desktop\build -Recurse -Include *.exe,*.msi,*.zip -ErrorAction SilentlyContinue
          )
          if (-not $candidates -or $candidates.Count -eq 0) {
            Write-Host "::warning::No Windows desktop package found under desktop/build"
            Get-ChildItem -Path desktop\build -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            exit 0
          }
          New-Item -ItemType Directory -Force -Path win-desktop-out | Out-Null
          $candidates | ForEach-Object { Copy-Item $_.FullName win-desktop-out\ }
          Get-ChildItem win-desktop-out | Format-Table Name,Length

      - name: Upload Windows desktop artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-Windows-Desktop
          path: win-desktop-out/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Electrobun update manifests (Windows)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-Windows-Updates
          path: desktop/artifacts/*
          if-no-files-found: warn
          retention-days: 7

  sbom:
    name: Release SBOM (CycloneDX)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.5"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Generate SBOMs
        run: |
          # The SBOM tools are exact-version pins but sit outside the project's
          # lock, so they stay a separate, hash-verified install. They are also
          # installed into setup-python's interpreter, NOT into the venv created
          # below -- see the PATH note further down.
          pip install cyclonedx-bom==7.4.0 cyclonedx-py==1.0.1 --only-binary :all:
          # The backend package goes in from the committed uv.lock rather than
          # `pip install -e .`, which resolved the whole transitive graph against
          # the live index at run time (githubactions:S8544). An SBOM is a
          # statement about exactly which versions shipped, so a graph that
          # floats per run is the specific thing that makes the artifact fiction.
          # Same shape as the load-smoke / perf-smoke / timing-budgets installs:
          # export from the lock, install with --require-hashes so uv re-verifies
          # every wheel against the sha256 digests the lock records, and --no-deps
          # so nothing is re-resolved. --only-binary :all: keeps sdist builds out,
          # so no third-party setup script runs at install time (S8541).
          #
          # --no-dev is load-bearing here, more so than anywhere else. `uv export`
          # with no group selector emits the default groups, and the dev group in
          # backend/pyproject.toml is [bandit, coverage, mutmut, pip-audit,
          # pytest-cov]. Those are CI-only tools: none of them is imported by the
          # shipped package, and none is installed into the release venv for the
          # release artifacts. Without --no-dev they were installed here anyway
          # and then written into sbom-python.cdx.json as if they had shipped, so
          # a downstream consumer reading the SBOM would see mutmut and pip-audit
          # as runtime dependencies of the released backend. An SBOM that
          # overstates the dependency surface is the same class of defect as one
          # that understates it: both make the artifact unreliable. --no-dev
          # means the SBOM lists only what the release actually contains.
          cd backend
          uv export --locked --no-emit-project --no-dev \
            --output-file "$RUNNER_TEMP/sbom-requirements.txt"
          uv venv
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/sbom-requirements.txt"
          # setuptools is the build backend for the editable install below, and
          # --no-build-isolation means uv will not provision it. `uv venv` on a
          # Linux runner has no setuptools, so take it from the lock: reading both
          # the version and the wheel hash out of uv.lock rather than writing them
          # here is also what keeps this step off S8544. The awk `exit` stops at
          # the first py3-none-any wheel so a second matching record cannot
          # contribute a second hash; the sdist hash deliberately does not match,
          # and --only-binary :all: means the sdist is never fetched anyway.
          SETUPTOOLS_VERSION="$(grep -A1 '^name = "setuptools"$' uv.lock | grep '^version' | cut -d'"' -f2)"
          test -n "$SETUPTOOLS_VERSION" || { echo "::error::could not read the locked setuptools version from backend/uv.lock" >&2; exit 1; }
          # A multi-line value means uv.lock now holds more than one setuptools
          # entry (uv splits packages that resolve differently per marker or
          # per Python version). `test -n` cannot catch that, because a
          # multi-line string is still non-empty; it would instead surface as an
          # opaque "Invalid version" pointing at the install line. The awk below
          # stops at the first match, so the hash guard would pass while the
          # version stayed multi-line -- one half defended, one half not. Fail
          # here, naming the real problem, and say which file has to change.
          # Count the newlines in the scraped value. ${V//[!$'\n']/} strips
          # every character except newlines, so its length is the newline
          # count: 0 for a single version, >0 once the lock is ambiguous.
          # Do NOT write this as `case "$V" in *"$(printf '\n')"*)`: command
          # substitution in an unquoted case pattern is word-split, the pattern
          # collapses to `**`, and it matches every value including a valid one,
          # which would fail this job on a perfectly good lockfile.
          SETUPTOOLS_NEWLINES="${SETUPTOOLS_VERSION//[!$'\n']/}"
          if [ "${#SETUPTOOLS_NEWLINES}" -ne 0 ]; then
            echo "::error::uv.lock holds more than one setuptools entry; the scrape produced:" >&2
            printf '%s\n' "$SETUPTOOLS_VERSION" >&2
            exit 1
          fi
          # Reject anything that is not a non-empty run of digits and dots.
          # The obvious-looking `[!0-9]*` pattern does not do this: it tests only
          # the FIRST character, so a real version like 83.0.0-rc1 or 83.0.0+local
          # passes it. uv.lock legitimately holds prerelease and local versions, so
          # that guard rejected nothing in the cases it was written for. Listing the
          # complement -- anything containing a character other than a digit or a dot,
          # or the empty string -- is the version that actually holds.
          case "$SETUPTOOLS_VERSION" in
            ''|*[!0-9.]*)
              echo "::error::setuptools version from uv.lock is not a plain version: $SETUPTOOLS_VERSION" >&2
              exit 1
              ;;
          esac
          SETUPTOOLS_HASH="$(awk '/^name = /{f=0} /^name = "setuptools"$/{f=1} f && /py3-none-any\.whl/{match($0,/sha256:[0-9a-f]+/); print substr($0,RSTART,RLENGTH); exit}' uv.lock)"
          test -n "$SETUPTOOLS_HASH" || { echo "::error::no setuptools py3-none-any wheel hash in backend/uv.lock" >&2; exit 1; }
          printf 'setuptools==%s --hash=%s\n' "$SETUPTOOLS_VERSION" "$SETUPTOOLS_HASH" \
            > "$RUNNER_TEMP/setuptools-req.txt"
          uv pip install --only-binary :all: --require-hashes --no-deps \
            -r "$RUNNER_TEMP/setuptools-req.txt"
          # First-party source: the one thing that legitimately gets built.
          #
          # backend/pyproject.toml declares build-system requires
          # ["setuptools>=61", "wheel"], but backend/uv.lock has NO `wheel`
          # record, so only setuptools can be installed from the lock here and
          # `wheel` is deliberately absent from the venv. That is not an
          # oversight below: it was verified rather than assumed. With
          # `--no-build-isolation` and `wheel` genuinely absent, the editable
          # build exits 0 and `import melosviz` succeeds, because setuptools
          # vendors its own wheel implementation and `setuptools.build_meta`
          # never imports the `wheel` package. The `wheel` entry in
          # build-system.requires is a legacy artifact of the setup.py-era
          # toolchain and has no effect on this backend path.
          uv pip install --no-deps --no-build-isolation -e .
          # The Python half of the SBOM has to describe the environment that
          # actually holds the shipped backend and its dependencies, which is the
          # venv populated above.
          #
          # Two traps here, both of which produced a well-formed SBOM of the
          # wrong environment instead of an error, so neither looked wrong:
          #
          # 1. PATH. The old `PATH="$PWD/.venv/bin:$PATH"` could not do what its
          #    comment claimed. Prepending a directory to PATH only changes
          #    which file of a given NAME is found, and the venv has no
          #    `cyclonedx-py` console script at all (the tools are installed into
          #    setup-python's interpreter, not the venv). So the bare
          #    `cyclonedx-py` still resolved to the setup-python script and
          #    reported on THAT interpreter -- which holds cyclonedx-bom and its
          #    own dependencies, and none of the backend.
          #
          # 2. Which process imports the module. cyclonedx-py takes the target
          #    environment as a POSITIONAL argument; it is not run inside the
          #    target interpreter. So `.venv/bin/python -m cyclonedx_py` fails
          #    outright, with "No module named cyclonedx_py" -- reproduced
          #    against a real 1.0.1 install, not reasoned about. The module must
          #    be imported by the interpreter that HAS it (setup-python's), with
          #    the venv's interpreter passed as the positional argument.
          #
          # Both of those were checked against cyclonedx-py 1.0.1: the positional
          # form exits 0, writes a valid SBOM, and that SBOM describes the
          # passed-in venv (it does NOT contain the outer interpreter's
          # cyclonedx-bom).
          #
          # --pyproject names the root component. Without it the SBOM's metadata
          # component is a generic placeholder, and a consumer reading the
          # artifact cannot tell which release this describes. The step runs from
          # backend/, so this file is the real backend metadata and reports the
          # actual version from it.
          cyclonedx-py environment "$PWD/.venv/bin/python" \
            --pyproject "$PWD/pyproject.toml" \
            --output-file ../sbom-python.cdx.json
          test -s ../sbom-python.cdx.json || {
            echo "::error::cyclonedx-py produced no SBOM" >&2
            exit 1
          }
          # `test -s` only proves a file exists and is non-empty. An SBOM of the
          # WRONG environment is non-empty and would sail through it, which is
          # how the PATH bug survived. Assert the root component names this
          # project, which only holds if the SBOM was built from the venv's
          # pyproject rather than from a placeholder.
          python - <<'PY'
          import json, pathlib, sys

          doc = json.loads(pathlib.Path("../sbom-python.cdx.json").read_text("utf-8"))
          component = (doc.get("metadata") or {}).get("component") or {}
          name = (component.get("name") or "").lower().replace("_", "-")
          if name != "melosviz":
              sys.exit(
                  f"::error::SBOM root component is {component.get('name')!r}, "
                  "expected 'melosviz'; the SBOM did not describe the release venv"
              )
          version = component.get("version")
          print(f"SBOM root component: {component.get('name')} {version} "
                f"({len(doc.get('components') or [])} components)")
          PY
          cd ..
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all --override-filename sbom-cargo.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MelosViz-SBOM
          path: |
            sbom-python.cdx.json
            sbom-cargo.cdx.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [macos-desktop, linux-cli, windows-cli, windows-desktop, sbom]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all build artifacts
        # actions/download-artifact v8.0.1 — SHA-pinned
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: _artifacts

      - name: List downloaded artifacts
        run: find _artifacts -type f -ls

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          : > SHA256SUMS
          while IFS= read -r -d '' f; do
            # Relative path keeps the manifest portable across download layouts.
            rel="${f#_artifacts/}"
            (cd _artifacts && sha256sum "$rel") >> SHA256SUMS
          done < <(find _artifacts -type f -print0 | sort -z)
          mkdir -p _artifacts/MelosViz-Checksums
          cp SHA256SUMS _artifacts/MelosViz-Checksums/SHA256SUMS
          wc -l SHA256SUMS
          head -20 SHA256SUMS

      - name: Install cosign
        # sigstore/cosign-installer v3.8.2 — SHA-pinned
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.4.3

      - name: Cosign sign-blob SHA256SUMS (keyless OIDC)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign-blob \
            --bundle _artifacts/MelosViz-Checksums/SHA256SUMS.cosign.bundle \
            SHA256SUMS
          cosign verify-blob \
            --bundle _artifacts/MelosViz-Checksums/SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp 'https://github.com/KooshaPari/Melosviz/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          ls -la _artifacts/MelosViz-Checksums/

      - name: Attest release artifacts
        # actions/attest-build-provenance v4.1.1 — SHA-pinned
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            _artifacts/MelosViz-macOS/*
            _artifacts/MelosViz-macOS-Updates/*
            _artifacts/MelosViz-Linux/*
            _artifacts/MelosViz-Windows-CLI/*
            _artifacts/MelosViz-Windows-Desktop/*
            _artifacts/MelosViz-Windows-Updates/*
            _artifacts/MelosViz-SBOM/*
            _artifacts/MelosViz-Checksums/*

      - name: Publish release
        # softprops/action-gh-release v2.2.1 — SHA-pinned
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            _artifacts/MelosViz-macOS/*
            _artifacts/MelosViz-macOS-Updates/*
            _artifacts/MelosViz-Linux/*
            _artifacts/MelosViz-Windows-CLI/*
            _artifacts/MelosViz-Windows-Desktop/*
            _artifacts/MelosViz-Windows-Updates/*
            _artifacts/MelosViz-SBOM/*

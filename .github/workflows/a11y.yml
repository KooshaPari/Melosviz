name: A11y — axe + visual fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core (fixture) + screenshot golden
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install --with-deps chromium
      - name: Serve fixture
        run: |
          python3 -m http.server 8760 --directory web/a11y &
          echo $! > /tmp/http.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8760/fixture.html >/dev/null && break
            sleep 0.5
          done
      - name: axe-core CLI
        run: |
          npx --yes @axe-core/cli@4.10.1 \
            http://127.0.0.1:8760/fixture.html \
            --exit \
            --tags wcag2a,wcag2aa
      - name: Playwright screenshot golden
        run: |
          mkdir -p eval/golden/screenshots
          npx --yes playwright@1.52.0 screenshot \
            --browser chromium \
            --viewport-size=1280,720 \
            http://127.0.0.1:8760/fixture.html \
            eval/golden/screenshots/a11y-fixture.png
          ls -la eval/golden/screenshots/a11y-fixture.png
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a11y-fixture-screenshot
          path: eval/golden/screenshots/a11y-fixture.png
          if-no-files-found: error
          retention-days: 14
      - name: Stop server
        if: always()
        run: kill $(cat /tmp/http.pid) || true

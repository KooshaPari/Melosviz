name: A11y — axe + visual fixture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core (fixture) + screenshot golden
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install --with-deps chromium
      - name: Install web deps (R3F canvas fixture)
        # Prefer lock when valid; fall back to install for nested drei peers.
        run: |
          npm ci --prefix web --legacy-peer-deps --no-audit --no-fund \
            || npm install --prefix web --legacy-peer-deps --no-audit --no-fund
      - name: Start R3F canvas fixture dev server (Vite)
        working-directory: web
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5183 --strictPort > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5183/fixtures/r3f-canvas.html >/dev/null; then
              ready=1
              break
            fi
            # Bail early if vite exited
            if ! kill -0 "$(cat /tmp/vite.pid)" 2>/dev/null; then
              echo "vite exited early; log:"
              cat /tmp/vite.log || true
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then
            echo "vite did not become ready; log:"
            cat /tmp/vite.log || true
            exit 1
          fi
          echo "vite ready on :5183"
      - name: Serve fixtures
        run: |
          python3 -m http.server 8760 --directory web/a11y &
          echo $! > /tmp/http.pid
          # Serve desktop/ root so splash can load ../../assets/brand/tokens.css SoT
          python3 -m http.server 8761 --directory desktop &
          echo $! > /tmp/http2.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8760/fixture.html >/dev/null && break
            sleep 0.5
          done
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8761/views/main/splash.html >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8761/assets/brand/tokens.css >/dev/null
      - name: axe-core CLI
        run: |
          npx --yes @axe-core/cli@4.10.1 \
            http://127.0.0.1:8760/fixture.html \
            --exit \
            --tags wcag2a,wcag2aa
      - name: Playwright screenshot golden
        run: |
          mkdir -p eval/golden/screenshots
          npx --yes playwright@1.52.0 screenshot \
            --browser chromium \
            --viewport-size=1280,720 \
            http://127.0.0.1:8760/fixture.html \
            eval/golden/screenshots/a11y-fixture.png
          npx --yes playwright@1.52.0 screenshot \
            --browser chromium \
            --viewport-size=1280,720 \
            http://127.0.0.1:8761/views/main/splash.html \
            eval/golden/screenshots/desktop-splash.png
          # R3F canvas golden (G-C10-03 / WBS-P3.3): deterministic fixture —
          # frameloop="demand" + frozen performance.now(), not the live App
          # (no audio, no requestAnimationFrame drift). See
          # web/src/fixtures/r3fCanvasFixture.tsx + docs/VISUAL_SPEC.md.
          npx --yes playwright@1.52.0 screenshot \
            --browser chromium \
            --viewport-size=960,540 \
            --wait-for-selector "body[data-fixture-ready='true']" \
            http://127.0.0.1:5183/fixtures/r3f-canvas.html \
            eval/golden/screenshots/r3f-canvas.png
          ls -la eval/golden/screenshots/
      - name: Pixel-diff vs committed baselines
        run: |
          test -f eval/golden/screenshots/a11y-fixture.baseline.png
          test -f eval/golden/screenshots/desktop-splash.baseline.png
          npm ci --prefix scripts/visual-gate
          node scripts/visual-gate/compare.mjs \
            eval/golden/screenshots/a11y-fixture.baseline.png \
            eval/golden/screenshots/a11y-fixture.png \
            eval/golden/screenshots/a11y-fixture.diff.png \
            0.002
          node scripts/visual-gate/compare.mjs \
            eval/golden/screenshots/desktop-splash.baseline.png \
            eval/golden/screenshots/desktop-splash.png \
            eval/golden/screenshots/desktop-splash.diff.png \
            0.02
          test -f eval/golden/screenshots/r3f-canvas.baseline.png
          node scripts/visual-gate/compare.mjs \
            eval/golden/screenshots/r3f-canvas.baseline.png \
            eval/golden/screenshots/r3f-canvas.png \
            eval/golden/screenshots/r3f-canvas.diff.png \
            0.04
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a11y-fixture-screenshot
          path: |
            eval/golden/screenshots/a11y-fixture.png
            eval/golden/screenshots/a11y-fixture.diff.png
            eval/golden/screenshots/desktop-splash.png
            eval/golden/screenshots/desktop-splash.diff.png
            eval/golden/screenshots/r3f-canvas.png
            eval/golden/screenshots/r3f-canvas.diff.png
          if-no-files-found: error
          retention-days: 14
      - name: Stop server
        if: always()
        run: |
          kill $(cat /tmp/http.pid) || true
          kill $(cat /tmp/http2.pid) || true
          kill $(cat /tmp/vite.pid) || true

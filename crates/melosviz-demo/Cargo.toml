[package]
name = "melosviz-demo"
version = "0.1.0"
edition = "2021"
description = "Melosviz zero-dependency end-to-end fixture: storyboard -> generate -> ship"
license = "Apache-2.0"
publish = false

[[bin]]
name = "melosviz-demo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

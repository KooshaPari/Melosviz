[package]
name = "melosviz-render-wgpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Realtime preview renderer for MelosViz — wgpu (DX12/Vulkan/Metal/GLES), RenderSpec v2 input"
rust-version = "1.86"

[[bin]]
name = "melosviz-render"
path = "src/main.rs"

[lib]
name = "melosviz_render_wgpu"
path = "src/lib.rs"

[dependencies]
# wgpu 24.x: DX12/Vulkan/Metal + GLES (per-target). WGPU_BACKEND overrides at runtime.
# vulkan/gles are not top-level features in wgpu 24 — wgpu-core enables them per OS.
# angle = GLES on macOS; vulkan-portability = MoltenVK on Apple. default-features stays on.
wgpu = { version = "24", default-features = true, features = ["dx12", "metal", "wgsl", "angle", "vulkan-portability"] }
# Async runtime — wgpu's instance/adapter/device are async
pollster = "1.0"
# RenderSpec v2 deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# CLI argument parsing (for the melosviz-render binary)
clap = { version = "4", features = ["derive"] }
# Error handling
anyhow = "1"
# Hash for per-segment cache keys
ahash = "0.8"
# Byte order for rawvideo output
bytemuck = { version = "1", features = ["derive"] }
# PNG encoding for export-png / demo-frames subcommands
# wraps: image 0.25
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# tempdir for headless tests
tempfile = "3"
# Criterion benchmarking framework
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = []
# Enable headless offscreen rendering (required for export; windowed preview works without it)
headless = []

[[bench]]
name = "frame_setup"
harness = false

[[bench]]
name = "frame_time"
harness = false

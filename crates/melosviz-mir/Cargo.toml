[package]
name = "melosviz-mir"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust MIR (Media Intermediate Representation) analyzer for Melosviz audio"
repository = "https://github.com/KooshaPari/Melosviz"

[lib]
path = "src/lib.rs"

[[bin]]
name = "melosviz-mir"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

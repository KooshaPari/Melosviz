<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="MelosViz identity demo: warm spectrum wave">
  <title>MelosViz — L105 Identity Demo (warm spectrum wave)</title>
  <defs>
    <linearGradient id="mvBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e1f"/>
      <stop offset="1" stop-color="#2d1b3a"/>
    </linearGradient>
    <linearGradient id="mvSpectrum" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#ef4444"/>
      <stop offset="0.25" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="0.8"  stop-color="#22d3ee"/>
      <stop offset="1"    stop-color="#a371f7"/>
    </linearGradient>
    <style>
      .mv-mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .mv-bar {
        transform-origin: center bottom;
        animation: mv-eq 1.2s ease-in-out infinite;
      }
      @keyframes mv-eq {
        0%, 100% { transform: scaleY(0.3); }
        50%      { transform: scaleY(1); }
      }
      .mv-wave {
        animation: mv-wave 4s ease-in-out infinite;
      }
      @keyframes mv-wave {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      .mv-pulse {
        transform-origin: 240px 135px;
        animation: mv-glow 2.4s ease-in-out infinite;
      }
      @keyframes mv-glow {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50%      { opacity: 1;   transform: scale(1.08); }
      }
    </style>
  </defs>

  <rect width="480" height="270" fill="url(#mvBg)"/>

  <g transform="translate(40, 200)">
    <g class="mv-bar" style="animation-delay: -0.0s"><rect x="0"   y="-50" width="6" height="50" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.05s"><rect x="10"  y="-70" width="6" height="70" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.1s"><rect x="20"  y="-90" width="6" height="90" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.15s"><rect x="30"  y="-60" width="6" height="60" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.2s"><rect x="40"  y="-80" width="6" height="80" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.25s"><rect x="50"  y="-100" width="6" height="100" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.3s"><rect x="60"  y="-70" width="6" height="70" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.35s"><rect x="70"  y="-50" width="6" height="50" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.4s"><rect x="80"  y="-90" width="6" height="90" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.45s"><rect x="90"  y="-110" width="6" height="110" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.5s"><rect x="100" y="-80" width="6" height="80" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.55s"><rect x="110" y="-60" width="6" height="60" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.6s"><rect x="120" y="-90" width="6" height="90" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.65s"><rect x="130" y="-70" width="6" height="70" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.7s"><rect x="140" y="-100" width="6" height="100" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.75s"><rect x="150" y="-50" width="6" height="50" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.8s"><rect x="160" y="-80" width="6" height="80" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.85s"><rect x="170" y="-90" width="6" height="90" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.9s"><rect x="180" y="-70" width="6" height="70" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -0.95s"><rect x="190" y="-60" width="6" height="60" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -1.0s"><rect x="200" y="-100" width="6" height="100" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -1.05s"><rect x="210" y="-80" width="6" height="80" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -1.1s"><rect x="220" y="-50" width="6" height="50" fill="url(#mvSpectrum)" rx="2"/></g>
    <g class="mv-bar" style="animation-delay: -1.15s"><rect x="230" y="-70" width="6" height="70" fill="url(#mvSpectrum)" rx="2"/></g>
  </g>

  <g class="mv-wave">
    <path d="M -20 60 Q 30 40 60 60 T 120 60 T 180 60 T 240 60 T 300 60 T 360 60 T 420 60 T 480 60 T 540 60 T 600 60"
          fill="none" stroke="url(#mvSpectrum)" stroke-width="2" opacity="0.5"/>
  </g>

  <g class="mv-pulse">
    <circle cx="370" cy="80" r="22" fill="#1a0e1f" stroke="url(#mvSpectrum)" stroke-width="2.5"/>
    <circle cx="370" cy="80" r="6" fill="#facc15"/>
  </g>

  <g class="mv-mono">
    <text x="240" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#f6f8fa" letter-spacing="0.18em">MELOSVIZ</text>
    <text x="240" y="58" text-anchor="middle" font-size="9" fill="#facc15" letter-spacing="0.24em" opacity="0.9">spectrum · conductor · scene</text>
  </g>

  <g stroke="#facc15" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M22 22 L34 22 M22 22 L22 34"/>
    <path d="M458 22 L446 22 M458 22 L458 34"/>
    <path d="M22 248 L34 248 M22 248 L22 236"/>
    <path d="M458 248 L446 248 M458 248 L458 236"/>
  </g>
</svg>
# mutmut 3.x configuration for MelosViz backend (Python).
#
# Run from backend/:
#   python -m mutmut run                            # full mutation sweep
#   python -m mutmut results                        # show survivors
#   python -m mutmut show <id>                      # show a specific mutant
#
# Two different kill-score floors are in play and they are NOT the same gate:
#   * .qgate.toml [mutation].target_score is >=75% and governs the Rust
#     workspace via `cargo mutants`, which this Python config cannot influence.
#   * backend/tests/test_mutation_engine.py's TARGET_SCORE is 65 and governs
#     this Python AST-mutation harness over three modules.
# An earlier revision of this file said only ">=75% mutation kill-score", which
# read as the floor for the sweep configured here and overstated it. The Python
# harness's measured ceiling is 72.2% over its own per-target selections, so 75
# is unreachable for it at any assertion quality; see that module for the
# measurement and for why 65 is set below it.
#
# Survivor mutants must either be killed by tightening tests or filtered
# through `do_not_mutate` (fnmatch globs matched against source-file paths).
#
# NOTE: mutmut 3.x reads config from pyproject.toml [tool.mutmut]. This file
# is preserved for CI scripts that grep documentation, and is mirrored in
# pyproject.toml under [tool.mutmut]. Keep both in sync.
#
# Real schema (verified against mutmut 3.8.0's Config dataclass and its
# `_load_config` reader -- see mutmut/configuration.py):
#   source_paths                    list[str]  source dirs (or single files) to mutate
#   pytest_add_cli_args_test_selection
#                                   list[str]  test paths/dirs for every pytest run
#   pytest_add_cli_args             list[str]  extra CLI args for every pytest run
#   do_not_mutate                   list[str]  fnmatch GLOBS to exclude (not regexes)
#   also_copy                       list[str]  extra paths to copy for the mutant env
#   mutate_only_covered_lines       bool       skip lines outside coverage
#   type_check_command              list[str]  external type-check, must emit JSON
#                                         (must actually be installed, or the run
#                                         raises before any mutant is generated)
#   max_stack_depth                 int        recursion guard
#   debug                           bool       verbose tracing
#
# mutmut 2.x keys that NO LONGER EXIST and warn on every run:
#   paths_to_mutate, tests_dir  -> use source_paths /
#                                  pytest_add_cli_args_test_selection
# mutmut 3.x commands that NO LONGER EXIST (the 2.x CLI was removed):
#   `mutmut junitxml`           -> use `mutmut export-cicd-stats`, which writes
#                                  mutants/mutmut-cicd-stats.json
#   `mutmut run --paths-to-mutate / --tests-dir / --runner`
#                                -> scope and test selection come only from
#                                   pyproject.toml; `mutmut run` takes just
#                                   `--max-children` and mutant-name filters

source_paths = ["src/melosviz/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Mirrors [tool.mutmut].pytest_add_cli_args in pyproject.toml, including the
# --deselect. That deselect is load-bearing, not cosmetic: without it mutmut
# runs tests/test_mutation_engine.py once per outer mutant, and that module
# drives its own nested mutation sweep, so the outer sweep recurses on itself
# across the whole population. Keep this value identical to the pyproject one.
pytest_add_cli_args = [
    "-q",
    "--tb=no",
    "-x",
    "--deselect",
    "tests/test_mutation_engine.py::test_mutation_kill_score_meets_qgate_bar",
]
# fnmatch's `*` crosses path separators (it becomes `.*`, and `/` is not
# special), so the second pattern covers every package init at any depth and
# the third covers the package root. The explicit touchdesigner entry that used
# to be here was redundant: `src/melosviz/*/__init__.py` already matches it.
# Mirrors the explanation and the pattern list in pyproject.toml [tool.mutmut].
do_not_mutate = [
    "src/melosviz/cli/*.py",            # CLI glue / entry-points (nested too)
    "src/melosviz/*/__init__.py",       # package init stubs, any depth
    "src/melosviz/__init__.py",         # package root init
]
# Copy the non-Python data the tests read into mutants/ alongside the source.
#
# mutmut 3 rebuilds the tree under `mutants/` and runs pytest from there, so a
# test that resolves a data file against the working directory looks inside
# `mutants/` and finds nothing. `workflows/` holds the six Jinja2 templates the
# render adapters load; without this the render adapters fail with
# "Workflow template not found: .../backend/mutants/workflows/sdxl_image.json"
# (dispatched run 36954491966 against fa31b74).
#
# only mutmut 3.8.0's `also_copy` does this. `copy_src_dir` copies source files
# but `setup_source_paths` only puts `.`, `src` and `source` on sys.path.
#
# Note this list is UNIONED with mutmut's own defaults, which already include
# `tests/` and `pyproject.toml` (configuration.py:184-195). tests/ matters here:
# tests/fixtures/ (k.wav, test_tone.wav) is the other non-Python data in
# backend/, and its two consumers are guarded by skipif(not K_WAV.exists()), so
# if the copy ever stopped carrying tests/ they would skip silently and the
# sweep would stay green while running two fewer tests. Do not add a redundant
# `tests/` entry here.
also_copy = ["workflows/"]
# type_check_command is intentionally absent -- see the note in pyproject.toml.

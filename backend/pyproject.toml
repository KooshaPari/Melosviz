[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melosviz"
version = "0.6.0"
description = "Melosviz backend package."
readme = "README.md"
requires-python = ">=3.10"
# Keep runtime deps intentionally minimal: the FFmpeg-backed video
# exporter in this package is implemented in pure standard library
# (struct + zlib for PNG, shutil/subprocess for ffmpeg) so it works
# in CI environments that only have a minimal Python image. Heavy
# numerical / DSP deps (numpy, scipy, librosa, opencv, fastapi, ...)
# are kept out of the install graph here so the test suite can run
# anywhere; downstream services that need them can add them via
# their own optional requirements. The only third-party runtime
# dep is pydantic, which the :class:`melosviz.analysis.models.RenderSpec`
# model is built on.
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
viz = "melosviz.cli.main:main"
melosviz = "melosviz.cli.main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "hypothesis>=6.100",
    "pytest-bdd>=7.0",
    # python-multipart is needed for bridge / FastAPI multipart form
    # parsing in test_bridge_studio_pipeline.py. It must be installed
    # at collection time (before pytest imports the bridge tests).
    "python-multipart>=0.0.9",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
]
# Heavy optional deps — install only what your pipeline needs:
#   pip install "melosviz[analysis]"   → librosa + numpy + scipy (MIR-enriched path)
#   pip install "melosviz[stems]"      → demucs + torch (stem separation)
#   pip install "melosviz[all]"        → everything above
analysis = [
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.13",
]
stems = [
    "demucs>=4.0",
    "torch>=2.0",
]
all = [
    "melosviz[analysis,stems]",
]
# Desktop bridge — FastAPI HTTP layer used by the Electrobun desktop shell.
# pip install "melosviz[bridge]"
bridge = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# Optional OpenTelemetry (spans + OTLP HTTP exporter).
# Enable with MELOSVIZ_OTEL=1 and/or OTEL_EXPORTER_OTLP_ENDPOINT.
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

# CI tooling that the library never imports but the quality gate installs
# alongside the package. Declaring these here, instead of naming them ad
# hoc in each workflow, is what lets uv.lock pin them. They were
# previously absent from the lock, so every workflow had to spell out its
# own versions, and SonarCloud's dependency-locking rule
# (githubactions:S8544) flagged each `pip install -e ".[...]"` line.
#
# `uv sync --all-extras --dev` now resolves all of them from uv.lock.
#
# Every entry here is installed under `--only-binary :all:`, which forbids
# building an sdist (S8541). That makes a wheel a hard requirement, so each
# lower bound sits at or above the first release that actually publishes
# one, checked against PyPI's file listings rather than assumed:
#
#   mutmut  3.0.3 and 3.0.4 are sdist-only; every 3.x release from 3.0.5 on
#           ships py3-none-any. `>=3.0` would let a future re-resolve pick
#           3.0.4 and turn the quality gate's install into a hard failure
#           whose message reads like a resolution problem, not a policy one.
#
# Verified 2026-10-01: all 95 packages in the quality-gate install closure
# (base + test + bridge + lint + analysis + dev) publish a wheel usable on
# linux-x86_64 at their locked version. The only sdist-only distributions in
# uv.lock are demucs, dora-search and antlr4-python3-runtime, and all three
# are reachable only through the `stems` extra.
#
# An earlier version of this comment ended "...which no guarded workflow
# installs", and that clause had become wrong: gpu-smoke.yml did install
# `stems`, via --all-extras. It no longer does -- it exports `--extra test
# --extra analysis` -- but the clause was not carried along, so the guarded
# workflows relying on it for `--only-binary :all:` were citing a reason that
# no longer held. The invariant that is actually true, and that those
# workflows rely on now, is the narrowing itself: each guarded workflow
# requests only the extras it needs, and none of them request `stems`.
# Before adding a dependency here, confirm it publishes a wheel:
#   python -c "import json,urllib.request as u;d=json.load(u.urlopen('https://pypi.org/pypi/<name>/<version>/json'));print([f['packagetype'] for f in d['urls']])"
[dependency-groups]
dev = [
    "pytest-cov>=5.0",
    "coverage>=7.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mutmut>=3.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Include the PEP 561 ``py.typed`` marker so downstream type-checkers
# (mypy, pyright, ...) treat the package as fully typed instead of
# falling back to ``Any`` for unannotated functions.
[tool.setuptools.package-data]
"melosviz" = ["py.typed", "i18n/locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the ruleset narrow: critical correctness + modern style only.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "N",    # pep8-naming
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by formatter)
    # UP042 suggests ``class X(enum.StrEnum)`` over ``class X(str, Enum)``.
    # We intentionally use ``(str, Enum)`` because ``requires-python = ">=3.10"``
    # and the CI test matrix includes Python 3.10, where ``enum.StrEnum``
    # does not exist (added in 3.11). See PR #277 for context.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# RenderSpec is a pydantic model: don't let mypy trip on the dynamic
# pydantic field assignment that ``cinematic.apply`` does.
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "flaky: quarantined / known-flaky; exclude with -m 'not flaky'",
    "slow: full pipeline integration tests (3-min track end-to-end)",
]

[tool.coverage.report]
exclude_also = [
    # Standard guards
    "if __name__ == .__main__.:",
    # TYPE_CHECKING blocks: Python never executes these at runtime, so
    # they are unreachable from the interpreter's point of view.
    "if TYPE_CHECKING:",
    # Genuinely-unreachable defensive guards (empty-segment, empty-array,
    # exhaustive enum returns).  These were already carrying
    # ``# pragma: no cover`` for a reason — they protect against impossible
    # inputs and cannot be exercised by any test without contriving the
    # caller to violate its contract.
    "pragma: no cover",
]
omit = []

# -----------------------------------------------------------------------------
# mutmut 3.x (mutation testing) — keeps in sync with backend/mutmut.toml.
# Target: >=75% kill-score (see ../../.qgate.toml [mutation].target_score).
# -----------------------------------------------------------------------------
[tool.mutmut]
# mutmut 3.x keys. `paths_to_mutate` and `tests_dir` were REMOVED in mutmut 3
# and each emits a UserWarning on every run; the replacements are
# `source_paths` and `pytest_add_cli_args_test_selection`. Verified against the
# installed mutmut 3.8.0 configuration module.
source_paths = ["src/melosviz/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The mutmut 2.x `--runner "python -m pytest -q --tb=no -x"` has no mutmut 3
# equivalent. mutmut 3 assembles its own pytest invocation and appends these to
# it, so they carry the same intent: keep mutant runs short and output terse.
pytest_add_cli_args = ["-q", "--tb=no", "-x"]
# Copy the non-Python data the tests read into mutants/ alongside the source.
#
# mutmut 3 rebuilds the tree under `mutants/` and runs pytest from there, so a
# test that resolves a data file against the working directory looks inside
# `mutants/` and finds nothing. Dispatched run 36954491966 against fa31b74 is
# the proof, on a suite that otherwise runs green in quality-gate-reusable:
#   ConductorError: adapter for scene_type='comfyui_image' failed:
#     Workflow template not found:
#     .../backend/mutants/workflows/sdxl_image.json
#   . Set $MELOSVIZ_COMFYUI_WORKFLOWS_DIR or ship the file.
#
# This is not specific to mutmut: `copy_src_dir` (utils/file_utils.py:50)
# copies every source file, but `setup_source_paths` (line 80) only puts the
# `.`, `src` and `source` trees on sys.path. Nothing copies data files, so
# every CWD-relative data dependency in the test suite breaks under mutation.
# `workflows/` holds the six Jinja2 templates the render adapters load.
#
# It is not the only non-Python data in backend/: `tests/fixtures/` is the other
# (k.wav, test_tone.wav), and it needs no entry here because mutmut's own
# loader always appends `tests/` to also_copy (configuration.py:184-195, which
# unions the configured list with tests/, test/, setup.cfg, pyproject.toml,
# uv.lock, poetry.lock, Pipfile.lock, pdm.lock and test*.py). So the fixtures
# already ride along and both test_beat_track_isolation.py tests still collect.
#
# That default is load-bearing and worth stating, because those two tests are
# guarded by `@pytest.mark.skipif(not K_WAV.exists(), ...)`: if mutmut ever
# stopped copying `tests/`, they would skip silently and the sweep would report
# green while running two fewer tests. Verified against this tree: those are
# the only non-Python data files under backend/ outside the venv.
#
# The alternative -- exporting MELOSVIZ_COMFYUI_WORKFLOWS_DIR to the real tree
# -- would fix this one variable and leave the next bare-CWD reference
# unresolved. also_copy is the general fix, and it is the option mutmut
# provides for exactly this case (configuration.py:184, invoked from
# __main__.py:957).
also_copy = ["workflows/"]
# Skip CLI entry-points, re-export stubs, and package __init__ modules.
#
# These are GLOBS, not regexes. mutmut 3 matches them with fnmatch.fnmatch
# (configuration.Config._should_ignore_for_mutation), so the previous regex
# forms such as "src/melosviz/cli/.*\.py$" matched nothing at all: verified
# against this tree, they excluded 0 of 80 files, so the sweep was mutating
# every __init__.py and the CLI entry-points it was meant to skip.
#
# fnmatch's `*` DOES cross path separators: it translates to `.*`, and `/` is
# not a special character. So `src/melosviz/*/__init__.py` matches an
# `__init__.py` at ANY depth below `src/melosviz/`, not only one directory down,
# and `src/melosviz/cli/*.py` covers nested files under `cli/` as well. That is
# what makes the two globs sufficient on their own, and why the explicit
# touchdesigner entry that used to sit between them was redundant.
#
# Verified against this tree with fnmatch.fnmatch, the exact call mutmut makes
# (configuration.py:299). All 18 __init__.py files are matched by one of these
# two patterns, including the two nested a level deeper (llm/critic/ and
# render/audio_finishing/), which a non-crossing `*` would have missed.
# Excluded total: 20 of 80 source files -- the 18 __init__.py files plus
# cli/main.py and cli/partial_rerender.py -- and nothing outside those groups.
do_not_mutate = [
    "src/melosviz/cli/*.py",
    "src/melosviz/*/__init__.py",
    "src/melosviz/__init__.py",
]
# type_check_command deliberately unset.
#
# It used to run `python -m mypy`, but mypy lives in the `lint` extra and is
# not installed by the mutation job, which installs from
# `uv export --extra test --extra bridge`. Verified against that export: mypy is
# absent, while bandit, pip-audit, pytest and mutmut are present. mutmut 3 runs
# the command through subprocess and raises when it produces no JSON, so
# leaving it configured would fail the run before any mutant is generated. Set
# it in an environment that actually has mypy if type-check-based killing is
# wanted there.

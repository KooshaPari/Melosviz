[package]
name = "melosviz-desktop"
version = "0.1.0"
edition = "2021"
description = "Melosviz desktop shell (Tauri v2)"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "melosviz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
